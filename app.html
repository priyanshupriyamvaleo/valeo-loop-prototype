<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valeo · The Loop — App</title>
<script>
/* ?m=1 → device-native review mode. Runs before paint; inert without the param. */
if (new URLSearchParams(location.search).has('m')) {
  document.querySelector('meta[name=viewport]').setAttribute('content',
    'width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no');
  document.write('<meta name="apple-mobile-web-app-capable" content="yes">'
    + '<meta name="mobile-web-app-capable" content="yes">'
    + '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
    + '<meta name="theme-color" content="#FFFDF5">');
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system/tokens.css">
<link rel="stylesheet" href="design-system/components.css">
<link rel="stylesheet" href="design-system/loop.css">
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="vendor/babel.js"></script>
<style>
/* ═══════════ SHELL ═══════════ */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);background:#0E1D2E;color:#E6EDF5;overflow:hidden}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
#root{height:100vh}
:root{--mono:ui-monospace,'SF Mono',Menlo,'Roboto Mono',monospace}
.app{display:flex;flex-direction:column;height:100vh}

.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:#14283F;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
.brand__m{width:26px;height:26px;border-radius:7px;background:var(--yellow);color:#14283F;
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:15px}
.brand__s{color:#7E93AC;font-weight:500;font-size:12px}
.msw{display:flex;background:rgba(0,0,0,.28);border-radius:9px;padding:3px}
.msw button{padding:6px 15px;border-radius:6px;font-size:12px;font-weight:600;color:#8DA2BB}
.msw button.on{background:var(--yellow);color:#14283F}
.chips{display:flex;gap:8px;margin-left:auto;align-items:center}
.chipx{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:999px;
  padding:5px 12px;font-size:11.5px;font-weight:600}
.chipx b{color:var(--yellow);font-weight:800;font-variant-numeric:tabular-nums}
.tbtn{font-size:11.5px;font-weight:600;color:#8DA2BB;padding:6px 12px;border-radius:7px;
  border:1px solid rgba(255,255,255,.12)}
.tbtn:hover{color:#fff;border-color:rgba(255,255,255,.3)}

.main{flex:1;display:flex;min-height:0}
.rail{width:246px;flex-shrink:0;overflow-y:auto;background:#122234;
  border-right:1px solid rgba(255,255,255,.07);padding:12px 0 40px}
.rail::-webkit-scrollbar{width:6px}.rail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}
.rhint{font-size:10.5px;color:#5E7391;padding:0 16px 10px;line-height:1.5}
.sname{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#5E7391;
  padding:12px 16px 6px;display:flex;align-items:center;gap:7px}
.sname::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07)}
.nd{display:flex;align-items:center;gap:9px;padding:7px 16px;font-size:12.3px;color:#A9BCD1;
  cursor:pointer;border-left:2px solid transparent;line-height:1.3}
.nd:hover{background:rgba(255,255,255,.05);color:#fff}
.nd.on{background:rgba(255,185,0,.12);border-left-color:var(--yellow);color:#fff;font-weight:600}
.nd__d{width:6px;height:6px;border-radius:50%;background:#33475E;flex-shrink:0}
.nd.vis .nd__d{background:#5B7A99}
.nd.on .nd__d{background:var(--yellow);box-shadow:0 0 0 3px rgba(255,185,0,.2)}
.nd__l{flex:1;overflow:hidden;text-overflow:ellipsis}
.bdg{font-size:9px;padding:1px 5px;border-radius:4px;font-weight:800;flex-shrink:0}
.b-fork{background:rgba(255,185,0,.18);color:var(--yellow)}
.b-time{background:rgba(127,216,164,.15);color:#7FD8A4}
.b-loop{background:rgba(159,184,255,.16);color:#9FB8FF}
.b-app{background:rgba(255,255,255,.14);color:#fff}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:0;padding:18px;position:relative;
  background:radial-gradient(70% 55% at 50% 0%,rgba(255,185,0,.06),transparent 70%),#0E1D2E}
.ktag{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:9px;padding:4px 11px;border-radius:5px}
.ktag--n{background:rgba(111,214,155,.16);color:#7FD8A4}
.ktag--d{background:rgba(255,255,255,.08);color:#93A9C2}
.ktag--m{background:var(--yellow);color:#14283F}
.phonewrap{position:relative}
.phone{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;
  transform-origin:top center;background:#FFFDF5;
  box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 9px #060D16,0 0 0 10px #2B3F56}
.phone iframe{width:390px;height:844px;border:0;display:block}

/* ═══════════ MOBILE MODE (?m=1) — device-native, zero prototype chrome ═══════════
   Everything here is scoped under body.mob, so the desktop shell above is
   completely unaffected. The screen becomes the viewport: no bezel, no scale
   transform, no rail/panel/toolbar. One unobtrusive control remains so the
   flow is still navigable during review. */
body.mob{overflow:hidden;background:#000;overscroll-behavior:none}
body.mob #root{height:100dvh}
body.mob .mstage{width:100vw;height:100dvh;position:relative;overflow:hidden;
  background:var(--surface-app)}
body.mob .phone{width:100%;height:100%;border-radius:0;box-shadow:none;
  transform:none!important;transform-origin:top left}
body.mob .phone iframe{width:100%;height:100%}
body.mob .pscreen{width:100%;height:100%}
body.mob .meta{width:100%;height:100%;border-radius:0}

/* Nav affordance — docked to the right edge as a slim tab rather than a
   floating circle, because most screens end in a full-width sticky CTA and
   a bottom-right FAB lands right on top of it. */
.mfab{position:fixed;right:0;top:50%;transform:translateY(-50%);
  width:17px;height:52px;border-radius:9px 0 0 9px;z-index:900;
  background:rgba(27,57,91,.55);color:rgba(255,255,255,.85);backdrop-filter:blur(6px);
  font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:-3px 0 12px -3px rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.16);border-right:none}
.mfab:active{background:var(--yellow);color:#14283F}
.msheet{position:fixed;inset:0;z-index:1000;background:rgba(6,13,22,.62);
  backdrop-filter:blur(3px);display:flex;flex-direction:column;justify-content:flex-end}
.msheet__in{background:#122A45;border-radius:20px 20px 0 0;max-height:82dvh;
  display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  box-shadow:0 -12px 40px rgba(0,0,0,.5)}
.msheet__g{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);
  margin:9px auto 4px;flex-shrink:0}
.msheet__act{display:flex;gap:8px;padding:8px 14px 12px;flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.09)}
.msheet__act button{flex:1;padding:11px;border-radius:11px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.09);color:#E6EDF5}
.msheet__act button:disabled{opacity:.35}
.msheet__act button.pri{background:var(--yellow);color:#14283F}
.msheet__l{overflow-y:auto;padding:6px 10px 10px;-webkit-overflow-scrolling:touch}
.msheet__s{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:#6D86A3;padding:12px 8px 5px}
.msheet__n{display:flex;align-items:center;gap:9px;padding:10px 10px;border-radius:10px;
  font-size:13px;color:#C7D6E6}
.msheet__n.on{background:var(--yellow);color:#14283F;font-weight:700}
.msheet__n i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.28);flex-shrink:0}
.msheet__n.on i{background:#14283F}
.msheet__n.vis i{background:#6FD69B}

/* ═══════════ TWIN MATCH — glass photo cards ═══════════ */
/* sized so the swipe controls stay above the fold on a 375x812 handset */
.tdeck{position:relative;height:min(432px,50vh);margin:4px -2px 0;touch-action:pan-y}
.tc{position:absolute;inset:0;border-radius:26px;overflow:hidden;will-change:transform;
  background:#22354C;box-shadow:0 22px 52px -18px rgba(18,42,69,.55),0 0 0 1px rgba(27,57,91,.09)}
.tc--drag{transition:none}
.tc--rest{transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.tc__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tc__mono{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:74px;font-weight:700;color:rgba(255,255,255,.30);
  letter-spacing:.04em}
/* keeps the name legible over any photo */
.tc__scrim{position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(10,22,38,.42) 0%,rgba(10,22,38,0) 26%,
    rgba(10,22,38,.20) 52%,rgba(10,22,38,.86) 100%)}
.tc__match{position:absolute;top:13px;right:13px;padding:8px 11px;border-radius:13px;
  background:rgba(12,24,40,.52);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.20);text-align:center;z-index:3}
.tc__mn{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1;color:var(--yellow);
  font-variant-numeric:tabular-nums}
.tc__mk{font-family:var(--mono);font-size:7px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.62);margin-top:4px}
.tc__tier{position:absolute;top:15px;left:13px;z-index:3}
/* the glass panel — bottom two-thirds, Bumble-style */
.tc__glass{position:absolute;left:9px;right:9px;bottom:9px;z-index:2;border-radius:19px;
  padding:13px 14px 12px;background:rgba(16,30,48,.52);backdrop-filter:blur(20px) saturate(140%);
  border:1px solid rgba(255,255,255,.16);color:#fff}
.tc__twin{font-family:var(--mono);font-size:7.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--yellow)}
.tc__name{font-family:var(--font-display);font-size:23px;font-weight:600;line-height:1.1;
  margin-top:4px}
.tc__role{font-size:11.5px;color:rgba(255,255,255,.68);margin-top:4px}
.tc__hook{display:flex;gap:7px;align-items:flex-start;margin-top:9px;padding-top:9px;
  border-top:1px solid rgba(255,255,255,.15);font-size:12.5px;line-height:1.42;
  color:rgba(255,255,255,.92);font-weight:600}
.tc__pay{margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.15);
  display:flex;align-items:center;gap:11px;position:relative}
.tc__pro{font-size:13px;font-weight:700}
.tc__meta{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.55);margin-top:3px}
/* PARTIAL blur — identity stays sharp, only the payoff is gated */
.tc__blurred{filter:blur(7px);user-select:none;pointer-events:none}
.tc__lockbtn{position:absolute;inset:-6px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;gap:7px;background:rgba(12,24,40,.34);
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:#fff;z-index:4}

/* learning counter — replaces the pass-reason modal (P18) */
.learn{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:15px;
  background:var(--surface-sunken);margin-bottom:11px}
.learn__i{width:26px;height:26px;border-radius:50%;background:var(--green-soft);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--green)}
.learn__t{flex:1;font-size:11.5px;color:var(--ink-2);line-height:1.4}
.learn__t b{color:var(--deep)}
.learn__bar{display:flex;gap:2px;width:74px;flex-shrink:0}
.learn__bar i{flex:1;height:5px;border-radius:1px;background:rgba(27,57,91,.13)}
.learn__bar i.on{background:var(--green)}

/* drum picker */
.drum{position:relative;height:246px;overflow:hidden;flex:1}
.drum__s{height:246px;overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;-ms-overflow-style:none;padding:98px 0}
.drum__s::-webkit-scrollbar{display:none}
.drum__i{height:50px;display:flex;align-items:center;justify-content:center;
  scroll-snap-align:center;font-size:20px;color:var(--ink-2);opacity:.34;
  transition:opacity .2s,transform .2s}
.drum__i.on{opacity:1;font-size:29px;font-weight:700;color:var(--deep)}
.drum__win{position:absolute;left:0;right:0;top:98px;height:50px;border-radius:14px;
  background:#fff;box-shadow:0 3px 12px -4px rgba(27,57,91,.18);pointer-events:none;z-index:-1}
.unit{display:inline-flex;background:rgba(27,57,91,.08);border-radius:11px;padding:3px;margin:0 auto}
.unit button{padding:7px 17px;border-radius:9px;font-size:12px;font-weight:700;color:var(--ink-2)}
.unit button.on{background:#fff;color:var(--deep);box-shadow:0 2px 7px -2px rgba(27,57,91,.2)}

/* question chrome */
.qbar{display:flex;align-items:center;gap:12px;padding:10px 18px 4px}
.qbar__t{flex:1;height:3px;border-radius:2px;background:rgba(27,57,91,.10);overflow:hidden}
.qbar__f{height:100%;background:var(--yellow);border-radius:2px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.qbar__s{font-size:13px;font-weight:700;color:var(--ink-2)}
.qh{font-family:var(--font-display);font-size:29px;font-weight:600;color:var(--deep);
  line-height:1.14;letter-spacing:-.01em}
.qsub{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.5}
.qgrp + .qgrp{border-top:1px solid rgba(27,57,91,.08);margin-top:18px;padding-top:18px}
.qgrp__t{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:var(--deep);
  margin-bottom:11px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip2{padding:10px 15px;border-radius:999px;background:rgba(27,57,91,.06);font-size:13px;
  font-weight:500;color:var(--text-primary);transition:background .15s,color .15s}
.chip2.on{background:var(--deep);color:#fff;font-weight:600}
.priv{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-2);
  padding:12px 0 0}
.why{font-size:11.5px;color:var(--ink-2);text-align:center;padding-top:10px}
.why u{color:var(--teal);cursor:pointer}
.gbtn{width:54px;height:54px;border-radius:50%;background:var(--deep);color:#fff;font-size:20px;
  display:flex;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0}
.gbtn:disabled{background:rgba(27,57,91,.22)}

/* goal cards */
.gcard{width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:16px;
  border-radius:18px;background:#fff;box-shadow:var(--shadow-sm);margin-bottom:10px;
  border:1.5px solid transparent}
.gcard.on{border-color:var(--deep);background:var(--surface-sunken)}
.gcard__i{width:44px;height:44px;border-radius:14px;background:var(--surface-sunken);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.gcard.on .gcard__i{background:#fff}
.gcard__t{font-size:14.5px;font-weight:700;color:var(--deep)}
.gcard__s{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}

/* celebration interstitial */
.cheer{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 26px;text-align:center}
.cheer__h{font-family:var(--font-display);font-size:32px;font-weight:600;color:var(--deep);
  line-height:1.16}
.glass{border-radius:22px;padding:8px;background:rgba(255,255,255,.62);
  border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(10px);
  box-shadow:0 16px 40px -18px rgba(27,57,91,.3);width:100%;margin-top:24px}
.glass__r{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:15px;
  background:#fff;margin-bottom:6px;text-align:left}
.glass__r:last-child{margin-bottom:0}
.glass__r--dim{background:rgba(255,255,255,.5)}
.glass__i{width:20px;flex-shrink:0;text-align:center;opacity:.6}
.glass__v{font-size:13.5px;color:var(--text-primary);font-weight:500}

/* map picker */
.mapw{position:relative;border-radius:20px;overflow:hidden;height:262px;background:#DCE6EC;
  box-shadow:inset 0 0 0 1px rgba(27,57,91,.09)}
.mapw img{width:100%;height:100%;object-fit:cover;display:block}
.mappin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);z-index:2;
  background:var(--deep);color:#fff;font-size:12.5px;font-weight:700;padding:8px 13px;
  border-radius:11px;white-space:nowrap;box-shadow:0 6px 16px -5px rgba(0,0,0,.45)}
.mappin::after{content:'';position:absolute;left:50%;bottom:-5px;width:10px;height:10px;
  transform:translateX(-50%) rotate(45deg);background:var(--deep)}
.mapme{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;
  background:var(--deep);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:17px;z-index:2;box-shadow:0 5px 14px -4px rgba(0,0,0,.4)}
.mapin{width:100%;border:none;border-bottom:1.5px solid var(--deep);background:transparent;
  padding:12px 2px;font-size:14px;color:var(--text-primary);font-family:inherit;margin-top:16px}
.mapin::placeholder{color:var(--ink-2)}

/* ═══════════ THE MARK ═══════════ */
.glyph{margin:0 auto}
.glyph--live .ring__fill{animation:glyphPulse 3.4s ease-in-out infinite}
@keyframes glyphPulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ═══════════ TWIN FLOW — deck, tiers, twin meter ═══════════ */

/* — twin completeness meter — */
.tm{display:flex;align-items:center;gap:10px}
.tm__bar{flex:1;height:7px;border-radius:4px;background:rgba(27,57,91,.10);overflow:hidden;position:relative}
.tm__fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--yellow),var(--yellow-deep));
  transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tm__ghost{position:absolute;top:0;height:100%;border-radius:4px;
  background:repeating-linear-gradient(115deg,rgba(255,185,0,.30) 0 4px,transparent 4px 8px)}
.tm__n{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--deep);
  font-variant-numeric:tabular-nums;flex-shrink:0}
.tm--dark .tm__bar{background:rgba(255,255,255,.14)}
.tm--dark .tm__n{color:#fff}

/* — the deck — */
.deck{position:relative;height:454px;margin:6px -2px 0;touch-action:pan-y}
.dcard{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:#fff;
  box-shadow:0 18px 44px -16px rgba(27,57,91,.34),0 0 0 1px rgba(27,57,91,.07);
  display:flex;flex-direction:column;will-change:transform}
.dcard--drag{transition:none}
.dcard--rest{transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.dcard__top{padding:15px 16px 13px;color:#fff;position:relative;overflow:hidden;flex-shrink:0;
  background:linear-gradient(158deg,#1B395B,#16304C 62%,#122A45)}
.dcard__top::after{content:'';position:absolute;right:-56px;top:-64px;width:186px;height:186px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,185,0,.20),transparent 68%)}
.dcard__tierrow{display:flex;align-items:center;gap:7px;position:relative;z-index:1}
.tpill{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;padding:4px 8px;border-radius:6px;display:inline-flex;gap:4px;align-items:center}
.dcard__mt{margin-left:auto;text-align:right}
.dcard__mn{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1;
  color:var(--yellow);font-variant-numeric:tabular-nums}
.dcard__mk{font-family:var(--mono);font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-top:3px}
.dcard__ic{font-size:30px;margin:12px 0 7px;position:relative;z-index:1}
.dcard__t{font-family:var(--font-display);font-size:25px;font-weight:600;line-height:1.13;
  position:relative;z-index:1}
.dcard__soc{display:flex;gap:7px;align-items:flex-start;margin-top:11px;padding-top:11px;
  border-top:1px solid rgba(255,255,255,.14);position:relative;z-index:1}
.dcard__soc b{color:var(--yellow);font-weight:700}
.dcard__socx{font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.82)}
.dcard__body{flex:1;padding:15px 16px;display:flex;flex-direction:column;min-height:0}
.dcard__use{font-size:14.5px;line-height:1.42;color:var(--deep);font-weight:600}
.dcard__meta{display:flex;gap:0;margin-top:auto;padding-top:13px;border-top:1px solid var(--line)}
.dcard__m{flex:1}
.dcard__m + .dcard__m{border-left:1px solid var(--line);padding-left:12px}
.dcard__mv{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--deep);

.dcard__ml{font-family:var(--mono);font-size:7.5px;letter-spacing:.15em;text-transform:uppercase;

.dcard__hint{text-align:center;font-size:10.5px;color:var(--ink-2);margin-top:11px}

/* swipe verdict stamps */
.stamp{position:absolute;top:22px;padding:7px 13px;border-radius:9px;font-family:var(--mono);

/* deck controls */
.dctl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
.dbtn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:#fff;box-shadow:0 6px 18px -6px rgba(27,57,91,.34),0 0 0 1px rgba(27,57,91,.07)}
.dbtn--save{width:62px;height:62px;background:var(--green);color:#fff;font-size:24px;
  box-shadow:0 10px 24px -8px rgba(39,153,91,.6)}
.dbtn--info{width:44px;height:44px;font-size:15px;color:var(--ink-2)}

/* — locked tier teaser — */
.lock{margin-top:16px;border-radius:20px;padding:16px;position:relative;overflow:hidden;
  background:linear-gradient(152deg,#16304C,#122A45);color:#fff}
.lock__blur{display:flex;gap:8px;margin-top:12px}

.lock__cs{font-family:var(--mono);font-size:8px;letter-spacing:.1em;color:var(--yellow);margin-top:6px}
.lock__cta{margin-top:14px;width:100%;padding:13px;border-radius:13px;background:var(--yellow);
  color:var(--deep);font-size:13.5px;font-weight:700}

/* — trigger rows (data capture) — */
.trg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0}
.trg + .trg{border-top:1px solid rgba(27,57,91,.07)}
.trg__i{width:38px;height:38px;border-radius:12px;background:var(--surface-sunken);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.trg__t{font-size:13.5px;font-weight:600;color:var(--text-primary)}
.trg__s{font-size:11px;color:var(--ink-2);margin-top:2px}
.trg__p{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--green);flex-shrink:0}
.trg--done .trg__i{background:var(--green-soft)}

/* — saved / portfolio rows — */
.prow{display:flex;align-items:center;gap:12px;padding:14px 0}

.prow__i{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;

.prow__t{font-size:14px;font-weight:600;color:var(--text-primary)}
.prow__s{font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.45}
.prow__cta{flex-shrink:0;padding:9px 13px;border-radius:11px;font-size:11.5px;font-weight:700;

/* — loop hero on Protocols — */
.lhero{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(158deg,#1B395B,#16304C 60%,#122A45)}
.lhero::after{content:'';position:absolute;right:-70px;top:-80px;width:230px;height:230px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,185,0,.16),transparent 68%)}
.lhero__row{display:flex;align-items:center;gap:15px;position:relative;z-index:1}
.lhero__k{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--yellow)}
.lhero__t{font-family:var(--font-display);font-size:21px;font-weight:600;margin-top:5px;line-height:1.16}
.lhero__s{font-size:11.5px;color:rgba(255,255,255,.62);margin-top:5px;line-height:1.5}
.lhero__ph{display:flex;gap:7px;margin-top:14px;font-family:var(--mono);font-size:8.5px;

.lhero__ph span{color:rgba(255,255,255,.3)}

/* — question card (onboarding) — */
.q{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow-sm)}
.q__k{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-2)}
.q__t{font-family:var(--font-display);font-size:22px;font-weight:600;color:var(--deep);
  margin-top:7px;line-height:1.2}
.qo{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 14px;

  font-weight:600;color:var(--text-primary)}
.qo.on{background:var(--deep);color:#fff}
.qo__k{width:22px;height:22px;border-radius:50%;background:rgba(27,57,91,.09);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.qo.on .qo__k{background:var(--yellow);color:var(--deep)}

/* — assembly / "cooking" — */
.asm{font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.5);display:flex;
  gap:9px;align-items:center;padding:7px 0}
.asm b{color:#6FD69B;font-weight:700}
.asm--now{color:#fff}
.asm--now b{color:var(--yellow)}

/* — AI coach — */
.coach{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border-radius:18px;
  padding:14px;background:linear-gradient(152deg,#254A73,#1B395B);color:#fff}
.coach__av{width:40px;height:40px;border-radius:50%;background:var(--yellow);color:var(--deep);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.coach__t{font-size:13.5px;font-weight:700}
.coach__s{font-size:11px;color:rgba(255,255,255,.62);margin-top:2px;line-height:1.45}
.bub{max-width:82%;padding:11px 13px;border-radius:15px;font-size:13px;line-height:1.5;margin-top:9px}
.bub--ai{background:var(--surface-sunken);color:var(--text-primary);border-bottom-left-radius:5px}
.bub--me{background:var(--deep);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.esc{margin-top:13px;padding:12px 13px;border-radius:14px;background:var(--mint);
  border:1px solid var(--yellow);font-size:12px;line-height:1.5;color:#7A6320}
.esc b{color:var(--deep)}
.pscreen{width:390px;height:844px;display:flex;flex-direction:column;background:var(--surface-app);
  position:relative;overflow:hidden}
.pbody{flex:1;overflow-y:auto}
.pbody::-webkit-scrollbar{display:none}

.why{width:306px;flex-shrink:0;overflow-y:auto;background:#122234;
  border-left:1px solid rgba(255,255,255,.07);padding:20px 20px 40px}
.why::-webkit-scrollbar{width:6px}.why::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:3px}
.why__id{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--yellow);margin-bottom:5px}
.why__t{font-family:var(--font-display);font-size:21px;font-weight:600;color:#fff;line-height:1.25;margin-bottom:14px}
.why__k{font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#5E7391;margin:20px 0 7px}
.why__b{font-size:12.5px;line-height:1.68;color:#AFC2D6}
.why__b b{color:#fff;font-weight:600}
.exit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:11.5px;
  padding:8px 11px;border-radius:8px;background:rgba(255,255,255,.05);color:#A9BCD1;margin-bottom:6px}
.exit:hover{background:rgba(255,185,0,.14);color:#fff}
.exit i{color:#5E7391;font-style:normal;font-size:10px}

.bottom{height:52px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 18px;
  background:#14283F;border-top:1px solid rgba(255,255,255,.08)}
.nbtn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#A9BCD1;
  padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.13)}
.nbtn:hover:not(:disabled){color:#fff;border-color:var(--yellow)}
.nbtn:disabled{opacity:.3;cursor:default}
.trail{flex:1;display:flex;align-items:center;gap:5px;overflow:hidden}
.cr{font-size:10.5px;padding:3px 9px;border-radius:5px;white-space:nowrap;
  background:rgba(255,255,255,.06);color:#8DA2BB;flex-shrink:0;cursor:pointer}
.cr.now{background:var(--yellow);color:#14283F;font-weight:700}

/* meta cards */
.meta{width:390px;height:844px;overflow-y:auto;padding:34px 26px;display:flex;flex-direction:column;
  background:linear-gradient(165deg,#16293F,#0D1B2B);border:2px dashed rgba(255,185,0,.42);border-radius:44px}
.meta::-webkit-scrollbar{display:none}
.meta__e{font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin-bottom:16px}
.meta__i{font-size:38px;margin-bottom:14px}
.meta__t{font-family:var(--font-display);font-size:27px;font-weight:600;color:#fff;line-height:1.2;margin-bottom:10px}
.meta__q{font-size:13.5px;color:#B9CCE1;line-height:1.6}
.meta__w{font-size:11.5px;color:#7E93AC;line-height:1.6;border-left:2px solid rgba(255,185,0,.35);
  padding-left:11px;margin:14px 0 22px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:rgba(255,255,255,.055);border:1.5px solid rgba(255,255,255,.11);border-radius:15px;
  padding:15px 16px;margin-bottom:11px;transition:.14s}
.opt:hover{background:rgba(255,255,255,.11);border-color:var(--yellow);transform:translateX(3px)}
.opt__k{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;background:rgba(255,255,255,.1);color:#93A9C2}
.opt:hover .opt__k{background:var(--yellow);color:#14283F}
.opt__l{display:block;font-size:14px;font-weight:600;color:#fff;line-height:1.35}
.opt__s{display:block;font-size:11.5px;color:#8DA2BB;margin-top:4px;line-height:1.45}
.opt--go .opt__l{color:#8CE0AE}.opt--warn .opt__l{color:#F2C46B}
.opt--null .opt__l{color:#B8C6D8}.opt--grey .opt__l{color:#8DA2BB}.opt--stop .opt__l{color:#F09A96}
.skb{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:20px 0 8px}
.skb i{display:block;height:100%;background:var(--yellow);animation:fill 1.1s ease-out forwards}
@keyframes fill{from{width:0}to{width:100%}}
.dl{display:flex;justify-content:space-between;font-size:12px;padding:9px 13px;border-radius:9px;
  background:rgba(255,255,255,.05);margin-bottom:8px}
.dl span{color:#8DA2BB}.dl b{color:#fff;font-variant-numeric:tabular-nums}
.mcta{width:100%;background:var(--yellow);color:#14283F;border-radius:13px;padding:15px;font-size:14px;font-weight:700}
.mfoot{font-size:10.5px;color:#66798F;text-align:center;margin-top:12px;line-height:1.5}
.grow{flex:1;min-height:10px}

/* map */
.map{flex:1;overflow:auto;padding:30px 38px 80px}
.mapin{position:relative;display:flex;gap:42px;min-width:max-content}
.mcol{width:212px;flex-shrink:0}
.mch{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow);
  margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid rgba(255,185,0,.25)}
.mn{background:#17293C;border:1.5px solid rgba(255,255,255,.1);border-radius:11px;padding:10px 12px;
  margin-bottom:11px;cursor:pointer;transition:.13s}
.mn:hover{border-color:var(--yellow);transform:translateY(-2px)}
.mn.on{border-color:var(--yellow);background:#22374F;box-shadow:0 0 0 3px rgba(255,185,0,.16)}
.mn__i{font-size:9px;font-weight:800;color:#5E7391}
.mn__l{font-size:12px;font-weight:600;color:#DCE7F2;line-height:1.3;margin-top:3px}
.mn__s{font-size:10px;color:#7E93AC;margin-top:3px;line-height:1.4}
.mn--fork{background:#2B2515;border-color:rgba(255,185,0,.34)}
.mn--time{background:#14291F;border-color:rgba(127,216,164,.3)}
.mn--loop{background:#1B2039;border-color:rgba(159,184,255,.32)}
.mlg{display:flex;gap:18px;margin-bottom:20px;font-size:11px;color:#7E93AC;align-items:center;flex-wrap:wrap}
.mlg i{width:22px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}

/* ═══════════ HUD — Ultrahuman's *structure*, Valeo's palette ═══════════
   Borrowed: mono tabular numerals, wide-tracked micro-labels, hairline
   rules, discrete segmented bars, live indicator. NOT borrowed: their
   near-black + mint. This sits on Valeo deep navy with the brand yellow,
   and the accent semantics match the Loop Ring — yellow = in progress,
   green = closed. */
.hud{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;
  background:linear-gradient(168deg,#1B395B 0%,#16304C 58%,#122A45 100%);
  border:1px solid rgba(255,255,255,.10);width:100%;text-align:left;display:block;
  box-shadow:0 18px 40px -16px rgba(18,42,69,.62), inset 0 1px 0 rgba(255,255,255,.07);}
.hud::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(255,255,255,.035) 23px 24px),
             repeating-linear-gradient(90deg,transparent 0 23px,rgba(255,255,255,.022) 23px 24px);}
.hud::after{content:'';position:absolute;right:-64px;top:-72px;width:210px;height:210px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,185,0,.17),transparent 68%);pointer-events:none;}
.hud__bar{display:flex;align-items:center;gap:7px;position:relative;z-index:1;margin-bottom:16px;}
.hud__lbl{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--yellow);}
.hud__live{margin-left:auto;display:flex;align-items:center;gap:5px;font-family:var(--mono);
  font-size:8.5px;letter-spacing:.16em;color:rgba(255,255,255,.4);}
.hud__dot{width:5px;height:5px;border-radius:50%;background:var(--yellow);animation:hp 1.8s ease-in-out infinite;}
@keyframes hp{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,185,0,.5)}50%{opacity:.4;box-shadow:0 0 0 4px rgba(255,185,0,0)}}
.hud__stats{display:flex;position:relative;z-index:1;}
.hud__s{flex:1;}
.hud__s + .hud__s{border-left:1px solid rgba(255,255,255,.11);padding-left:16px;}
.hud__n{font-family:var(--mono);font-size:40px;font-weight:700;line-height:.95;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.hud__k{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:rgba(255,255,255,.45);margin-top:7px;}
.hud__rule{height:1px;background:linear-gradient(90deg,rgba(255,185,0,.34),rgba(255,255,255,.06));
  margin:16px 0 13px;position:relative;z-index:1;}
.hud__row{display:flex;align-items:center;gap:9px;position:relative;z-index:1;padding:5px 0;}
.hud__ic{font-size:12px;width:15px;flex-shrink:0;}
.hud__nm{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:rgba(255,255,255,.8);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hud__d{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:rgba(255,255,255,.45);
  font-variant-numeric:tabular-nums;flex-shrink:0;}
.hud__seg{display:flex;gap:2px;width:62px;flex-shrink:0;}
.hud__seg i{flex:1;height:7px;border-radius:1px;display:block;}
.hud__foot{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:13px;
  border-top:1px solid rgba(255,255,255,.1);position:relative;z-index:1;}
.hud__due{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.52);flex:1;}
.hud__due b{color:var(--yellow);}
.hud__cta{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--deep);background:var(--yellow);padding:8px 14px;border-radius:9px;}

/* ═══════════ APP SCREEN STYLES ═══════════ */
.kick{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(27,57,91,.38)}

.appnav{height:var(--tab-bar-height);flex-shrink:0;display:flex;padding-bottom:var(--safe-bottom);

.pk{background:linear-gradient(168deg,#1B395B,#14293F);border-radius:24px;padding:18px 18px 10px;
  color:#fff;margin-top:20px;box-shadow:0 16px 34px -16px rgba(18,42,69,.6)}

<script type="text/babel">
const {useReducer, useEffect, useRef, useCallback} = React;

/* ══════════════════════════════════════════════════════════════

   file:'x'  → self-contained document, rendered in an iframe
   ══════════════════════════════════════════════════════════════ */
const STAGES = ['Start','Valeo app','Discover','Onboard','Activate','Commit','Journey','Prove','Renew'];

const FLOW = {
'B-start': {type:'branch', stage:'Start', title:'Which journey?', icon:'🎬',
  q:'Two ways in. Both are fully walkable.',
  why:'A returning member and a first-time member see genuinely different products — loop_index changes the whole experience. Pick one; the rail and Map reach every node either way.',
  options:[
    {label:'First-time member', sub:'Meet your twin → swipe → consult → measure', to:'DS1', tone:'go'},
    {label:'Original onboarding', sub:'The evidence-first path — goal picker → intake → draw', to:'T3-1', tone:'alt'},
    {label:'Returning member', sub:'Day 28 of loop 1 — straight into the live app', to:'V0', tone:'alt'}
  ]},

'V0': {stage:'Valeo app', comp:'V0', title:'Valeo app home', hero:true, phase:'Act',
  note:'The protocol lives <b>inside the existing Valeo app</b>. The entry card carries a live Loop Ring, so you can see how far through the loop you are without opening anything.<br><br>This screen keeps the app\'s own 5-tab bar. Tapping the card swaps to the protocol\'s 3-tab bar with a <code>‹ Valeo</code> escape — two nested apps, two tab bars.',
  primary:'T2-P', exits:['T2-P','T3-1']},

/* ── ONBOARD ── */
'T3-1':{stage:'Onboard', file:'T3-1-goal-picker.html', title:'Goal picker', phase:'Measure',
  note:'Single-select, no auto-advance. The five unbuilt goals render like WHOOP\'s grey Recovery score — real UI, visibly disabled, dated. Never animated-closed.', primary:'T3-2', back:'B-start'},
'T3-2':{stage:'Onboard', file:'T3-2-intake.html', title:'Intake', phase:'Measure',
  note:'Every question must visibly move the sealed prediction. If an answer wouldn\'t change C4, it isn\'t asked.', primary:'B-elig', back:'T3-1'},
'B-elig':{type:'branch', stage:'Onboard', title:'Eligibility fork', icon:'⚖️',
  q:'Does this user clear the clinical threshold?',
  why:'Screening as branching, not a wall. The decline path is a designed surface, not an error state — and it is where a health company either earns trust or becomes a store.',
  options:[{label:'Clears the threshold', sub:'→ baseline', to:'B-blood', tone:'go'},
           {label:'Below the threshold', sub:'BMI 26.1 — the honest-decline path', to:'C7', tone:'stop'}]},

/* ── ACTIVATE ── */
'B-blood':{type:'branch', stage:'Activate', title:'Already have bloodwork?', icon:'📄',
  q:'Plenty of KSA users already have recent bloods — Al Borg, a hospital, an employer screening.',
  why:'Forcing a fresh draw is cost and friction, and for some users it is genuinely unnecessary. But an outside report cannot silently become the baseline: the retest must run on a matched assay or the verdict is fiction. So this fork has real consequences — one path skips the draw entirely.',
  options:[{label:'Yes — I have a recent report', sub:'Upload it; we read it free either way', to:'T3-3b', tone:'go'},
           {label:'No — book me a draw', sub:'Standard path', to:'T3-3', tone:'alt'}]},

'T3-3b':{stage:'Activate', file:'T3-3b-upload-bloodwork.html?frame=1', title:'Upload bloodwork', phase:'Measure',
  note:'“We’ll read it free, whether or not you go ahead” is real value delivered <b>before</b> any payment — the strongest version of selling-as-sequencing.<br><br>Recognised KSA labs are listed explicitly so the user can tell at a glance whether this will work for them.',
  primary:'B-usable', back:'B-blood'},

'B-usable':{type:'branch', stage:'Activate', title:'Can we use it as the baseline?', icon:'🔬',
  q:'The report has been read. Two things decide whether it can serve as the sealed prediction’s baseline.',
  why:'This is assay_version surfaced as a user-facing decision. Two HbA1c results from different methods are not comparable, and a verdict computed across them would be fiction. Refusing a free shortcut — and saying exactly why — is a stronger trust signal than accepting it.',
  options:[{label:'Matched lab, 18 days old', sub:'Accepted as baseline — the draw is skipped entirely', to:'T3-3c', tone:'go'},
           {label:'Different assay, 5 months old', sub:'Read free, but we draw our own', to:'T3-3d', tone:'warn'}]},

'T3-3c':{stage:'Activate', file:'T3-3b-upload-bloodwork.html?frame=2', title:'Accepted — draw skipped', phase:'Read',
  note:'A branch with real consequences: <b>this path removes the draw entirely</b> — days and cost gone. Most products treat “upload” as a formality; here it genuinely changes what happens next.<br><br>The schema field that makes the whole verification thesis work becomes the visible reason the shortcut is allowed — rigor as a feature, not fine print.',
  primary:'C2', back:'B-usable'},

'T3-3d':{stage:'Activate', file:'T3-3b-upload-bloodwork.html?frame=3', title:'Read free — draw needed', phase:'Measure',
  note:'The constraint becomes the pitch: <i>“Most products would just accept this and call it a baseline. That’s how you get a confident verdict that means nothing.”</i><br><br>And the upload is never wasted — it shaped the recommended panel and removed six intake questions. A declined path that returns nothing is a dead end; this one isn’t.',
  primary:'T3-4', back:'B-usable'},

'T3-3':{stage:'Activate', file:'T3-3-eligibility.html', title:'Baseline recommended', phase:'Measure',
  note:'<b>No drug name appears pre-login</b> — SFDA prohibits DTC advertising of prescription medicines. The acquisition surface sells the programme, never the molecule.', primary:'T3-4', back:'T3-2'},
'T3-4':{stage:'Activate', file:'T3-4-phlebotomy-booking.html', title:'Book at-home draw', phase:'Measure',
  note:'Gender-of-provider defaulted female-for-female with the slot trade-off shown <b>inline</b>. No mahram field — sending a female nurse dissolves the khalwah concern entirely.', primary:'SK-draw', back:'T3-3'},
'SK-draw':{type:'skip', stage:'Activate', title:'The draw happens', icon:'🩸', headline:'Tuesday, 10:12 AM',
  detail:'Four tubes. Fasted 8h. <b>assay_version recorded</b> — the field the entire week-12 comparison depends on.',
  deltas:[['Sample','Collected'],['Fasting','8h confirmed'],['Assay','QUEST-A1C-4.2']], to:'T3-5'},
'T3-5':{stage:'Activate', file:'T3-5-sample-processing.html', title:'Sample processing', phase:'Measure',
  note:'Status as a first-class object with a published ETA. The dead interval between draw and result is addressable inventory.', primary:'SK-lab', back:'T3-4'},
'SK-lab':{type:'skip', stage:'Activate', title:'48 hours in the lab', icon:'⏱', headline:'48 hours pass',
  detail:'Panel resulted and interpretation written. <b>Both ship together</b> — never a bare number first. Function\'s 28-day gap is the failure mode avoided.',
  deltas:[['Elapsed','+2 days'],['Markers','40 resulted'],['Out of range','3']], adv:{day:2}, to:'C1'},

/* ── COMMIT ── */
'C1':{stage:'Commit', file:'C1-results-ready.html?frame=1', title:'Results ready — push', phase:'Read',
  note:'The push names <b>the finding, not the event</b>. The screen is opened by someone who already knows the shape of the answer.', primary:'B-entry'},
'B-entry':{type:'branch', stage:'Commit', title:'Entry fork', icon:'📲',
  q:'Where does this user open their results?',
  why:'Native app was chosen for push — but that puts an install step upstream of the exact leak we\'re fixing. The web twin removes the gate: value lands first, install is asked for after.',
  options:[{label:'Taps the push → in app', sub:'The happy path', to:'C2', tone:'go'},
           {label:'Opens the emailed link', sub:'No install — the web twin', to:'C1w', tone:'alt'}]},
'C1w':{stage:'Commit', file:'C1-results-ready.html?frame=2', title:'Web / email twin', phase:'Read',
  note:'The results moment must not be gated behind an install. The app is offered afterwards — "to run the protocol" — never before.', primary:'C2', back:'B-entry'},
'C2':{stage:'Commit', file:'C2-the-one-thing.html', title:'The one thing that matters', phase:'Read',
  note:'One verdict sentence, one hero marker. The highlighted number is the count of <b>actions</b>, never problems.<br><br>Falsifier: 5-second test. Fewer than 4 of 5 naming the right marker = fail.', primary:'B-depth', back:'C1'},
'B-depth':{type:'branch', stage:'Commit', title:'How deep does this user go?', icon:'🔍',
  q:'Do they read the full panel before committing?',
  why:'C3 is optional depth, and the metric is uncomfortable: does expanding it LOWER attach rate? If so it is a leak wearing a feature\'s clothes.',
  options:[{label:'Straight to the plan', sub:'Most users', to:'C4', tone:'go'},
           {label:'Reads all 40 markers', sub:'The auditor', to:'C3', tone:'alt'}]},
'C3':{stage:'Commit', file:'C3-full-panel.html', title:'Full panel, ranked', phase:'Read',
  note:'Ranked by <b>impact score</b> (deviation × evidence). Normals collapse. Never alphabetical — Function sorts 148 markers A–Z on a triage screen.', primary:'C4', back:'C2'},
'C4':{stage:'Commit', file:'C4-sealed-prediction.html', title:'The sealed prediction', hero:true, phase:'Commit',
  note:'<b>The frame this project is judged on.</b> Metric: protocol attach rate.<br><br><b>Drafted, not yet sealed</b> — a licensed clinician signs it at C5b before any charge, which is what makes the seal an event the user witnesses rather than a claim. The adherence floor is visible from this moment — Calibrate hid theirs in legal, so members failed on day 40 and learned on day 400.', primary:'C5', back:'C2'},
'C5':{stage:'Commit', file:'C5-protocol.html', title:'The protocol', phase:'Commit',
  note:'<b>Rebuilt — this was a checkout.</b> It had line items, a price total and “continue to consent”: it answered <i>what’s in the box</i> when the user was asking <i>what happens to me</i>. Price is now gone entirely and lives on C6.<br><br>“Protocol” has two meanings and I had built the wrong one. This is the <b>scientific</b> sense — a method, a mission briefing. The ring appears here for the first time (Measure ✓ Read ✓ Commit ●) so the loop is <i>invoked</i> rather than described.<br><br>The 12-week arc names the hard part out loud — “nausea peaks day 2… the stretch most people quit in” — because naming it in advance is what makes it survivable. Who-does-what turns a purchase into a partnership, and one unmissable card carries the immediate next action.', primary:'RVW', back:'C4'},
'RVW':{stage:'Commit', file:'C5b-clinician-review.html?frame=1', title:'Clinician review', phase:'Commit',
  note:'<b>The gap this closes:</b> C4 claimed “Sealed by Dr. Sara Al-Amri” but no screen ever showed her looking at it — the clinician was asserted, never witnessed. The prediction is now <i>drafted</i> at C4 and <i>sealed here</i>.<br><br>Clinically this isn’t optional: tirzepatide is prescription-only under SFDA, so a licensed human must approve before anything ships.<br><br><b>Superhuman’s inversion</b> — review before payment makes this read as being <i>accepted</i>, not buying. Named, licensed clinician (Marek / LetsGetChecked), a checklist citing the user’s real numbers, a printed SLA (Superpower) and a prominent live-call escalation (Form Health).',
  primary:'SK-rvw', back:'C5'},

'SK-rvw':{type:'skip', stage:'Commit', title:'Review turnaround', icon:'⏱', headline:'3 hours pass',
  detail:'Async review, not a scheduled call — that is what keeps it from being Superhuman-expensive while keeping the human real. <b>No card has been touched.</b>',
  deltas:[['Reviewed by','Dr. Sara Al-Amri'],['Turnaround','3h 12m'],['Charged so far','SAR 0']], to:'B-rvw'},

'B-rvw':{type:'branch', stage:'Commit', title:'What did the clinician say?', icon:'🩺',
  q:'A licensed clinician has read the panel, the intake and the proposed prediction.',
  why:'This fork has to be able to return something other than “approved”. If every review came back clean, users would correctly conclude it is a rubber stamp — and the whole verification premise dies with it. “Approved with changes” is the default path on purpose.',
  options:[{label:'Approved, with changes', sub:'Slower start + one extra marker — the doctor is real', to:'RVW-c', tone:'go'},
           {label:'Approved as proposed', sub:'Straight through to consent', to:'C6', tone:'alt'},
           {label:'Wants to talk first', sub:'Books a free 15-minute call before signing', to:'T3-6', tone:'warn'},
           {label:'Not appropriate for this route', sub:'Declined — nothing charged, alternative offered', to:'C7', tone:'stop'}]},

'RVW-c':{stage:'Commit', file:'C5b-clinician-review.html?frame=2', title:'Approved, with changes', phase:'Commit',
  note:'<b>Why “with changes” is the default outcome:</b> a review that always approves is a checkbox, not a clinician. Showing a real, reasoned change is the entire point.<br><br>Both changes come straight from the GLP-1 research: slower titration because low ferritin plus early nausea is the documented week-three quit pattern, and adding TSH so a null result doesn’t send the user back to the start.<br><br>The seal is now an <b>event</b> — signed, licensed, timestamped, with the amendment rule stated up front rather than discovered later. And it stays reversible: “disagree? reply before you confirm — still nothing charged.”',
  primary:'C6', back:'B-rvw'},

'C6':{stage:'Commit', file:'C6-consent-commit.html', title:'Consent & commit', phase:'Commit',
  note:'Retest pre-booked at <b>100%</b> — it reserves a matched assay_version, without which the week-12 comparison is fiction.<br><br>Two promises: inconclusive never costs extra, results stay yours forever.', primary:'C6b', back:'C5'},
'C6b':{stage:'Commit', file:'C6b-order-confirmed.html', title:'Order confirmed', phase:'Act',
  note:'<b>The missing beat.</b> Payment used to drop the user straight onto the home screen with no acknowledgement of what they had bought or when anything happens. The reminder — named nurse, date, time, address — is the point of the screen, so it is the brightest object on it.<br><br><b>The ring advances here:</b> three arcs close and Act opens at 0%. Commit → Act is the most meaningful transition in the loop and it now has a visible moment instead of happening silently between screens.<br><br>“Nothing for you to do until Thursday” is deliberate — the gap between paying and starting is where anxious users invent work and disengaged users forget entirely.',
  primary:'V0', set:{day:1, adherence:100, phase:'Act', dayState:'day1', focus:'L1'}, back:'C6'},

  day:28, adherence:86, loop:1, phase:'Act', dayState:'ordinary', sheet:null, mode:'walk',
  /* twin-flow state */

  swipes:0, skipped:['sleep','stress','diet'], revealed:[], bloodBooked:false, focusTwin:null,

function reducer(s, a){
  switch(a.type){
    case 'GO': {
      if(!FLOW[a.to]) return s;
      const n = FLOW[a.to];
      let ns = {...s, node:a.to, sheet:null,
        history:(a.to!==s.node ? [...s.history, s.node] : s.history),
        visited:{...s.visited,[a.to]:1}};
      if(a.set) ns = {...ns, ...a.set};
      if(n.set) ns = {...ns, ...n.set};
      if(n.adv && n.adv.day) ns.day = ns.day + n.adv.day;
      if(n.phase) ns.phase = n.phase;
      return ns;
    }
    case 'BACK': {
      if(!s.history.length) return s;
      const h=[...s.history], prev=h.pop();
      return {...s, node:prev, history:h, sheet:null};
    }
    case 'SHEET': return {...s, sheet:a.sheet};
    case 'SET':   return {...s, ...a.patch};
    case 'MODE':  return {...s, mode:a.mode};

    /* ── twin flow ─────────────────────────────────────────── */
    /* Right swipe saves the TWIN's protocol — the card is a person, the
       payload is a protocol, so the whole downstream flow is unchanged. */
    case 'SAVE': {
      const w = TWINS.find(t=>t.id===a.id);
      const pid = w ? w.protocol : a.id;
      return {...s, deck:s.deck+1, twinCard:null, swipes:s.swipes+1,
        matched: undefined,
        saved: s.saved.indexOf(pid)>-1 ? s.saved : [...s.saved, pid],
        passed: s.passed.indexOf(a.id)>-1 ? s.passed : s.passed};
    }
    /* Left swipe is never interrupted (P18) — no modal, no reason picker.
       The counter converts the intent into forward motion instead. */
    case 'PASS':
      return {...s, deck:s.deck+1, twinCard:null, swipes:s.swipes+1,
        passed:[...s.passed, a.id]};
    case 'DECKRESET': return {...s, deck:0, twinCard:null, passed:[], swipes:0};
    case 'CARD':      return {...s, card:a.id};
    case 'TWINCARD':  return {...s, twinCard:a.id};
    /* Blur reveal: answering the owed groups reveals the card. */
    case 'REVEAL':
      return {...s, revealed:[...s.revealed, a.id],
        skipped:s.skipped.filter(g=>(a.groups||[]).indexOf(g)<0)};
    case 'ANSWERQ': {
      const qa = {...s.qa, ...a.patch};
      const gained = a.pct||0;
      return {...s, qa, twinPct: Math.min(100, s.twinPct+gained),
        skipped: a.group ? s.skipped.filter(g=>g!==a.group) : s.skipped};
    }
    case 'SKIPQ':
      return {...s, skipped: s.skipped.indexOf(a.group)>-1 ? s.skipped : [...s.skipped, a.group]};
    case 'BLOOD':     return {...s, bloodBooked:true, twinPct:Math.min(100,s.twinPct+8)};
    case 'RETURNTO':  return {...s, returnTo:a.to};
    case 'FOCUSTWIN': return {...s, focusTwin:a.id};
    case 'TWIN': {                     /* a trigger answered → twin grows */
      if(s.answered.indexOf(a.id)>-1) return s;
      const g = TRIGGERS.find(t=>t.id===a.id);
      return {...s, answered:[...s.answered, a.id],
        twinPct: Math.min(100, s.twinPct + (g?g.pct:0))};
    }
    case 'CONSULT':                    /* consult done → card flips, twin jumps */
      return {...s, consulted: s.consulted.indexOf(a.id)>-1 ? s.consulted : [...s.consulted, a.id],
        twinPct: Math.min(100, s.twinPct + 30)};
    case 'RESET': return {...INIT};
    default: return s;
  }
}

function LoopRing({size=30, phase='Act', fill=.6, loops=0, sw=15, dark=true}){
  const idx = PHASES.indexOf(phase);
  const ARC=101.58, GAP=451.34, C=552.92;
  const cls = i => i<idx ? 'ring__arc--done' : i===idx ? 'ring__arc--now' : 'ring__arc--todo';
  const trees=[]; for(let i=0;i<loops;i++) trees.push(70-i*13);
  return (
    <svg className={'ring'+(dark?' ring--on-dark':'')} width={size} height={size} viewBox="0 0 200 200">
      <g transform="translate(100,100)">
        {trees.map((r,i)=>(<circle key={i} className="ring__tree" r={r} strokeWidth="4" fill="none" opacity={.45-i*.12}/>))}
        {PHASES.map((p,i)=>(
          <circle key={p} className={cls(i)} r="88" strokeWidth={sw} fill="none"

        {idx>=0 && <circle className="ring__fill" r="88" strokeWidth={sw} fill="none"
                  strokeDasharray={(ARC*Math.max(0,Math.min(1,fill)))+' '+C} transform={'rotate('+(idx*72-90)+')'}/>}

  );
}

   The Loop Ring and the body have been two separate visual languages

      <circle cx="130" cy="130" r="96" fill="url(#glyphAura)"/>

      {/* ── the body, INSIDE the ring ── */}
      <g transform="translate(130,130) scale(.40) translate(-100,-215)">
        <g stroke={bodyFill} strokeLinecap="round" fill="none">
          <path d="M72,92 C58,104 52,130 49,158 L45,196" strokeWidth="17"/>
          <path d="M128,92 C142,104 148,130 151,158 L155,196" strokeWidth="17"/>
          <path d="M88,206 C86,258 84,320 83,392" strokeWidth="22"/>
          <path d="M112,206 C114,258 116,320 117,392" strokeWidth="22"/>
        </g>
        <ellipse cx="100" cy="40" rx="20" ry="24" fill={bodyFill}/>
        <rect x="91" y="58" width="18" height="18" rx="8" fill={bodyFill}/>
        <path d="M69,80 C67,75 73,71 80,71 L120,71 C127,71 133,75 131,80
                 L127,142 C126,168 121,190 117,206 L83,206 C79,190 74,168 73,142 Z"
              fill={bodyFill}/>
      </g>

      {/* ── the loop, ORBITING it ── */}
      <g transform="translate(130,130)">
        {trees.map((r,i)=>(
          <circle key={i} className="ring__tree" r={r} strokeWidth="3" fill="none"
                  opacity={.4-i*.1}/>))}
        {PHASES.map((p,i)=>(
          <circle key={p} className={cls(i)} r="112" strokeWidth="9" fill="none"
                  strokeDasharray={ARC*1.272+' '+GAP*1.272}
                  transform={'rotate('+(i*72-90)+')'}/>))}
        {idx>=0 && <circle className="ring__fill" r="112" strokeWidth="9" fill="none"
                  strokeDasharray={(ARC*1.272*Math.max(0,Math.min(1,fill)))+' '+C*1.272}
                  transform={'rotate('+(idx*72-90)+')'}/>}
      </g>
    </svg>
  );
}

/* ── DISCOVER · TWIN MATCHES ────────────────────────────────────
   The card is a PERSON; the payload is their protocol. Right swipe
   saves the protocol, so everything downstream is unchanged.

   Three deliberate departures from the old deck:
   · A left swipe is never interrupted (P18). No modal, no reason
     picker — the learning counter converts the intent forward.
   · Blur is PARTIAL (P17). Photo, name and hook stay sharp; only the
     match score and the protocol are gated. You have to know exactly
     whose door is shut or there's nothing to want.
   · Every detail sheet closes on the verdict promise, which is what
     keeps a celebrity-led deck honest (P19). */
function twinPool(st){
  return TWINS.filter(w=>{
    const g = TIERS[w.tier].gate;
    if(g==='blood' && !st.bloodBooked) return false;
    if(g==='loop'  && !LOOPS.some(l=>l.st==='done')) return false;
    return st.saved.indexOf(w.protocol)<0 && st.passed.indexOf(w.id)<0;
  }).sort((x,y)=> (y.id===st.focusTwin?1:0) - (x.id===st.focusTwin?1:0));
}
function isBlurred(w, st){ return w.blur && st.revealed.indexOf(w.id)<0; }
function nextGate(st){
  if(!st.bloodBooked) return {tier:TIERS.adv, ...GATE_COPY.blood};
  if(!LOOPS.some(l=>l.st==='done')) return {tier:TIERS.inn, ...GATE_COPY.loop};
  return null;
}

function Discover({st, go, dispatch}){
  const pool = twinPool(st);
  const w = pool[0];
  const [dx, setDx]   = React.useState(0);
  const [drag, setDrag] = React.useState(false);
  const [fly, setFly] = React.useState(0);
  const [taught, setTaught] = React.useState(false);
  const start = useRef(0);
  const TH = 88;

  const commit = (dir) => {
    if(!w || fly) return;
    setFly(dir); setDrag(false);
    setTimeout(()=>{
      setFly(0); setDx(0);
      dispatch({type: dir>0 ? 'SAVE' : 'PASS', id:w.id});
      /* B16 — 20 swipes was a promise; this is the payoff. */
      if(st.swipes+1 === SWIPE_TARGET) setTaught(true);
    }, 250);
  };
  const down = e => { if(!w || fly) return; start.current=e.clientX; setDrag(true);
    e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => { if(!drag || fly) return; setDx(e.clientX - start.current); };
  const up   = () => { if(!drag) return;
    if(dx> TH) return commit(1); if(dx< -TH) return commit(-1); setDx(0); setDrag(false); };

  /* blurred card → route to exactly the groups owed, then come back */
  const unlock = (tw) => {
    dispatch({type:'RETURNTO', to:{node:'DS-DISC', reveal:tw.id, groups:tw.needs}});
    go('DS3');
  };

  const off = fly ? fly*540 : dx;
  const gate = nextGate(st);
  const filled = Math.min(SWIPE_TARGET, st.swipes);

  return (
    <div className="pscreen">
      <StatusBar/>
      <div className="appbar">
        <button className="appbar__back" onClick={()=>go('V0')}>‹ Valeo</button>
        <span className="appbar__spacer"></span>
        <button className="appbar__ring" onClick={()=>go('T2-7')}>
          <span className="appbar__ringlabel"><b>Twin {st.twinPct}%</b>
            <span>{pool.length} matches</span></span>
        </button>
      </div>

      <div className="pbody">
        <div style={{padding:'8px 18px 24px'}}>
          <div className="kick">Discover</div>
          <h1 className="lede" style={{marginBottom:10}}>Your twin matches.</h1>

          {/* learning counter — the only thing a left swipe produces */}
          <div className="learn">
            <div className="learn__i">◍</div>
            <div className="learn__t">{st.swipes >= SWIPE_TARGET
              ? <><b>Your twin knows your type.</b> Matches are re-ordered for you.</>
              : <>Your twin is learning your type · <b>{st.swipes} of {SWIPE_TARGET}</b> swipes</>}</div>
            <span className="learn__bar">
              {Array.from({length:10}).map((_,i)=>(
                <i key={i} className={i < Math.round(filled/SWIPE_TARGET*10) ? 'on':''}/>))}
            </span>
          </div>

          {w ? (<>
            <div className="tdeck" onPointerDown={down} onPointerMove={move}
                 onPointerUp={up} onPointerCancel={up}>
              {pool.slice(1,3).reverse().map((c,i)=>{
                const d = pool.slice(1,3).length - i;
                return <div key={c.id} style={{position:'absolute',inset:0,zIndex:1,
                  pointerEvents:'none',transform:'scale('+(1-d*.03)+') translateY('+(d*9)+'px)',
                  opacity:1-d*.24}}>
                  <TwinCard tw={c} st={st} cls="tc--rest" style={{}}/></div>;
              })}
              <TwinCard tw={w} st={st} top={true} cls={drag?'tc--drag':'tc--rest'}
                style={{transform:'translateX('+off+'px) rotate('+(off/28)+'deg)', zIndex:5}}
                onTap={()=> isBlurred(w,st) ? unlock(w) : dispatch({type:'TWINCARD', id:w.id})}
                onUnlock={()=>unlock(w)}/>
            </div>

            <div className="dctl">
              <button className="dbtn" onClick={()=>commit(-1)}>✕</button>
              <button className="dbtn dbtn--info"
                onClick={()=> isBlurred(w,st) ? unlock(w) : dispatch({type:'TWINCARD', id:w.id})}>ⓘ</button>
              <button className="dbtn dbtn--save" onClick={()=>commit(1)}>♥</button>
            </div>
            <div className="dcard__hint">Saving costs nothing — you commit on the coach call.</div>
          </>) : (
            <div className="q" style={{textAlign:'center',padding:'28px 18px'}}>
              <div style={{fontSize:28}}>◍</div>
              <div className="q__t" style={{marginTop:8}}>That's everyone your twin can reach today.</div>
              <div style={{fontSize:12.5,color:'var(--ink-2)',marginTop:9,lineHeight:1.55}}>
                {gate ? gate.s : 'You’ve seen every twin on the platform.'}</div>
              <button className="btn btn--primary" style={{marginTop:15}} onClick={()=>go('T2-P')}>
                Go to my matches →</button>
              <button className="btn btn--ghost" style={{marginTop:8}}
                onClick={()=>dispatch({type:'DECKRESET'})}>Replay the deck</button>
            </div>
          )}

          {/* ── locked tier: a real face behind the blur, not a category ── */}
          {gate && (()=> {
            const teaser = TWINS.find(t=>t.tier===gate.tier.k) || TWINS[TWINS.length-1];
            return (
              <div className="lock" style={{marginTop:18}}>
                <div style={{display:'flex',alignItems:'center',gap:8,position:'relative',zIndex:1}}>
                  <span className="tpill" style={{background:'rgba(255,255,255,.13)',color:'#fff'}}>
                    {gate.tier.ic} {gate.tier.n}</span>
                  <span style={{marginLeft:'auto',fontFamily:'var(--mono)',fontSize:9,
                    letterSpacing:'.14em',color:'rgba(255,255,255,.5)'}}>LOCKED</span>
                </div>
                <div style={{display:'flex',gap:12,alignItems:'center',marginTop:13,
                  position:'relative',zIndex:1}}>
                  <div style={{width:60,height:74,borderRadius:14,flexShrink:0,overflow:'hidden',
                    background:teaser.tone,display:'flex',alignItems:'center',justifyContent:'center',
                    filter:'blur(3px)'}}>
                    <span style={{fontFamily:'var(--mono)',fontSize:22,fontWeight:700,
                      color:'rgba(255,255,255,.5)'}}>{teaser.mono}</span>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:15,fontWeight:700,filter:'blur(4.5px)',
                      userSelect:'none'}}>{teaser.name}</div>
                    <div style={{fontSize:11.5,color:'rgba(255,255,255,.66)',marginTop:5,
                      lineHeight:1.45}}>{teaser.hook}</div>
                  </div>
                </div>
                <div style={{fontSize:12.5,lineHeight:1.5,marginTop:13,position:'relative',zIndex:1,
                  color:'rgba(255,255,255,.82)'}}>{gate.s}</div>
                <button className="lock__cta" onClick={()=>go('T2-7')}>
                  {gate.t} {gate.tier.n} →</button>
              </div>
            );
          })()}
        </div>
      </div>

      {taught && <Sheet title="Your twin learned your type"
        sub={'From '+SWIPE_TARGET+' swipes, without you filling in a single form.'}
        onClose={()=>setTaught(false)} cta="Show me better matches">
        {[['You lean toward','protocols under 12 weeks'],
          ['You skip','anything needing daily injections'],
          ['You open','strength and recovery every time'],
          ['You ignore','aesthetic protocols entirely']].map(([k,v],i)=>(
          <div key={i} style={{display:'flex',gap:9,padding:'9px 0',
            borderTop:i>0?'1px solid rgba(27,57,91,.07)':'none',fontSize:13,lineHeight:1.45}}>
            <span style={{color:'var(--ink-2)',minWidth:88}}>{k}</span>
            <b style={{color:'var(--deep)',flex:1}}>{v}</b></div>))}
        <div style={{marginTop:14,padding:'12px 13px',borderRadius:14,background:'var(--green-soft)',
          fontSize:12,lineHeight:1.55,color:'#1c6b41'}}>
          Every swipe from here is scored against this. It gets sharper, not noisier.</div>
      </Sheet>}

      {st.twinCard && <TwinSheet id={st.twinCard} st={st} go={go} dispatch={dispatch}/>}
      <TabBar active="discover" go={go}/>
      <div className="home-indicator"></div>
    </div>
  );
}

function TwinCard({tw, st, style, cls, onTap, onUnlock, top}){
  const T = tierOf(tw.tier);
  const p = CATALOG.find(c=>c.id===tw.protocol) || {};
  const blurred = isBlurred(tw, st);
  const [imgOk, setImgOk] = React.useState(!!tw.img);
  return (
    <div className={'tc '+cls} style={style} onClick={onTap}>

          backdropFilter:'blur(12px)'}}>{T.ic} {T.n}</span></span>

      {/* match score is part of the payoff — gated with the protocol */}

        </div>
      </div>
    </div>
  );
}

/* Detail sheet. Ends on the verdict promise — the line that stops a
   celebrity-led deck from being a fan-merch store (P19). */
function TwinSheet({id, st, go, dispatch}){
  const tw = TWINS.find(t=>t.id===id); if(!tw) return null;
  const c = CATALOG.find(x=>x.id===tw.protocol) || {};
  const T = tierOf(tw.tier);
  const saved = st.saved.indexOf(tw.protocol)>-1;
  return (
    <Sheet title={tw.name} sub={tw.role+' · '+tw.handle}
      onClose={()=>dispatch({type:'TWINCARD', id:null})}
      cta={saved?'Saved — see my matches':'Save '+(tw.name.split(' ')[0])+'’s protocol'}
      onCta={()=>{ if(saved){dispatch({type:'TWINCARD',id:null}); go('T2-P');}
                   else {dispatch({type:'SAVE', id:tw.id}); dispatch({type:'TWINCARD', id:null});}}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
        <span className="tpill" style={{background:T.bg,color:T.c}}>{T.ic} {T.n}</span>
        <span style={{fontFamily:'var(--mono)',fontSize:11,fontWeight:700,color:'var(--deep)'}}>
          {tw.match}% match</span>
        <span style={{marginLeft:'auto',fontSize:11,color:'var(--ink-2)'}}>
          {c.wk} weeks · {c.mk}</span>
      </div>

      <div style={{display:'flex',gap:8,padding:'12px 13px',borderRadius:14,background:'var(--mint)',
        border:'1px solid var(--yellow)',marginBottom:16}}>

        <span style={{fontSize:12,lineHeight:1.5,color:'#7A6320'}}>{tw.hook}</span>
      </div>

      <div className="kick" style={{marginBottom:7}}>What {tw.name.split(' ')[0]} runs</div>
      {(c.stack||[]).map((s,i)=>(
        <div key={i} style={{display:'flex',gap:9,padding:'7px 0',fontSize:13,lineHeight:1.45}}>
          <span style={{color:'var(--green)',flexShrink:0}}>✓</span><span>{s}</span></div>))}

      <div style={{fontSize:12.5,lineHeight:1.55,color:'var(--ink-2)'}}>{c.risk}</div>

      <div className="kick" style={{margin:'16px 0 7px'}}>Who it's wrong for</div>
      <div style={{fontSize:12.5,lineHeight:1.55,color:'var(--ink-2)'}}>{c.wrong}</div>

      <div style={{marginTop:16,padding:'13px 14px',borderRadius:16,
        background:'linear-gradient(152deg,#1B395B,#122A45)',color:'#fff'}}>
        <div style={{fontFamily:'var(--mono)',fontSize:8.5,fontWeight:700,letterSpacing:'.18em',
          textTransform:'uppercase',color:'var(--yellow)'}}>◈ The part he can't give you</div>
        <div style={{fontSize:12.5,lineHeight:1.55,marginTop:8,color:'rgba(255,255,255,.86)'}}>
          In <b style={{color:'#fff'}}>{c.wk} weeks</b> we retest {c.mk} and tell you whether this
          worked <b style={{color:'var(--yellow)'}}>on you</b> — not on {tw.name.split(' ')[0]}.
        </div>
      </div>
    </Sheet>
  );
}

  const idx = PHASES.indexOf(L.phase);
  const done = LOOPS.some(l=>l.st==='done');
  const others = LOOPS.filter(l=>l.st==='active' && l.id!==L.id);

    <div className="pscreen loopbg">

function BodyMap({systems, sel, onSel}){
  /* Androgynous, abstract, shape-invariant anatomical index.
     It is NOT the patient's body: it never changes with weight, has no
     gendered anatomy, and exists to answer "where in my body is this?".
     That distinction is what keeps it clear of KSA MOH Art.20 / stigma concerns. */
  return (
    <svg viewBox="0 0 200 430" style={{width:190,height:'auto',display:'block',margin:'0 auto'}}>
      <defs>
        <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#FFFFFF"/><stop offset="55%" stopColor="#F6F1E4"/>
          <stop offset="100%" stopColor="#EBE3D2"/>
        </linearGradient>
        <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
      </defs>

      {/* limbs first, so the torso overlaps them cleanly */}
      <g stroke="url(#skin)" strokeLinecap="round" fill="none">
        <path d="M72,92 C58,104 52,130 49,158 L45,196" strokeWidth="17"/>
