/* ══════════════════════════════════════════════════════════════
   Drum picker — the dating-app wheel. Scroll-snap does the physics;
   we just read which row is centred.
   ══════════════════════════════════════════════════════════════ */
function Drum({from, to, value, onChange, suffix, step=1}){
  const ref = useRef(null);
  const vals = []; for(let v=from; v<=to; v+=step) vals.push(v);
  const ROW = 50;
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    const i = vals.indexOf(value);
    if(i>=0) el.scrollTop = i*ROW;
  },[]);
  const onScroll = () => {
    const el = ref.current; if(!el) return;
    const i = Math.max(0, Math.min(vals.length-1, Math.round(el.scrollTop/ROW)));
    if(vals[i] !== value) onChange(vals[i]);
  };
  return (
    <div className="drum">
      <div className="drum__win"></div>
      <div className="drum__s" ref={ref} onScroll={onScroll}>
        {vals.map(v=>(
          <div key={v} className={'drum__i'+(v===value?' on':'')}>
            {v}{suffix ? <span style={{fontSize:14,fontWeight:500,color:'var(--ink-2)',
              marginLeft:5}}>{suffix}</span> : null}
          </div>))}
      </div>
    </div>
  );
}

function ChipRow({group, value, onPick}){
  const g = QGROUPS[group];
  const sel = value || (g.multi ? [] : null);
  const on = o => g.multi ? sel.indexOf(o)>-1 : sel===o;
  const pick = o => onPick(g.multi
    ? (sel.indexOf(o)>-1 ? sel.filter(x=>x!==o) : [...sel, o])
    : o);
  return (
    <div className="qgrp">
      <div className="qgrp__t"><span style={{fontSize:16}}>{g.ic}</span>{g.t}</div>
      {g.sub && <div style={{fontSize:11.5,color:'var(--ink-2)',margin:'-6px 0 10px'}}>{g.sub}</div>}
      <div className="chips">
        {g.o.map(o=>(
          <button key={o} className={'chip2'+(on(o)?' on':'')} onClick={()=>pick(o)}>{o}</button>))}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   DS3 · The questions
   ══════════════════════════════════════════════════════════════
   Two modes:
   · full   — the three sets, with celebration interstitials
   · reveal — only the groups a blurred card is waiting on, then it
              reveals the card and returns to the deck (the tight loop)
   Trust primitives lifted from the references and upgraded for health:
   "Visible on profile" becomes "Only your clinician sees this", and the
   "why we ask" link is kept verbatim — on health data it earns more
   than it costs. */
function DsQuiz({st, go, dispatch}){
  const ret  = st.returnTo;
  const mode = ret && ret.groups && ret.groups.length ? 'reveal' : 'full';
  const [i, setI] = React.useState(0);
  const [a, setA] = React.useState({});
  const set = (k,v)=> setA(prev=>({...prev,[k]:v}));

  const STEPS = mode==='reveal'
    ? [{type:'multi', q:'Two quick ones', sub:'Then the card is yours.', groups:ret.groups}]
    : [
      {type:'drum',   k:'age',    q:'How old are you?',  from:18, to:80, def:34},
      {type:'chips',  k:'sex',    q:'Sex at birth',      sub:'It sets your reference ranges. Nothing else.',
        o:['Male','Female']},
      {type:'map',    k:'loc',    q:'Where should the nurse come?',
        sub:'We only ever show the area, never the address.'},
      {type:'height', k:'height', q:'What’s your height?'},
      {type:'weight', k:'weight', q:'And your weight?'},
      {type:'cheer',  h:'Off to a good start, Faisal.'},
      {type:'multi',  q:'Let’s talk lifestyle', sub:'No judgement — it changes what we’d put you on.',
        groups:['work','smoke','drink']},
      {type:'multi',  q:'And how you move', sub:'Be honest, not aspirational.',
        groups:['move','moveType']},
      {type:'multi',  q:'Food, sleep and stress', sub:'The three that move the most markers.',
        groups:['diet','sleep','stress','stressSrc']},
      {type:'goal',   k:'goal',   q:'What are you actually trying to change?'},
      {type:'goal2',  k:'goal2',  q:'And anything else?', sub:'Pick as many as apply.'},
      {type:'summary',h:'Your twin has what it needs.'}
    ];

  const step = STEPS[i];
  const total = STEPS.filter(x=>x.type!=='cheer' && x.type!=='summary').length;
  const doneN = STEPS.slice(0,i).filter(x=>x.type!=='cheer' && x.type!=='summary').length;
  const pct = Math.round(doneN/total*100);

  const finish = () => {
    if(mode==='reveal'){
      dispatch({type:'REVEAL', id:ret.reveal, groups:ret.groups});
      dispatch({type:'ANSWERQ', patch:a, pct:6});
      dispatch({type:'RETURNTO', to:null});
      go(ret.node || 'DS-DISC');
    } else {
      dispatch({type:'ANSWERQ', patch:a, pct:14});
      go('DS4');
    }
  };
  const next = () => { if(i < STEPS.length-1) setI(i+1); else finish(); };
  const skip = () => {
    if(step.groups) step.groups.forEach(g=>dispatch({type:'SKIPQ', group:g}));
    next();
  };

  /* how many groups on a multi screen are answered → the Next N/M counter */
  const gCount = step.groups
    ? step.groups.filter(g=>{ const v=a[g]; return QGROUPS[g].multi ? (v&&v.length) : !!v; }).length
    : 0;

  const canNext = step.type==='multi'  ? gCount>0
                : step.type==='chips'  ? !!a[step.k]
                : step.type==='goal'   ? !!a.goal
                : true;

  /* ── celebration + summary are full-bleed, no chrome ── */
  if(step.type==='cheer' || step.type==='summary'){
    return (
      <div className="pscreen">
        <StatusBar/>
        <div className="pbody" style={{display:'flex'}}>
          <div className="cheer">
            <div className="cheer__h">{step.h}</div>
            {step.type==='summary' && (
              <div className="glass">
                {[['🎂', a.age||34], ['⚧', a.sex||'Male'], ['📍', a.loc||'Al Olaya, Riyadh'],
                  ['📐', (a.height||'175')+' cm'], ['⚖️', (a.weight||96)+' kg'],
                  ['🎯', (GOALS.find(g=>g.k===a.goal)||GOALS[0]).t],
                  ['🍽', (a.diet&&a.diet.length? a.diet.slice(0,2).join(', ') : 'Grilled meat, rice')]
                ].map(([ic,v],n)=>(
                  <div className="glass__r" key={n}>
                    <span className="glass__i">{ic}</span>
                    <span className="glass__v">{v}</span></div>))}
              </div>)}
            <button className="btn btn--primary" style={{marginTop:26,maxWidth:280}}
                    onClick={next}>
              {step.type==='summary' ? 'Show me my twin matches →' : 'Continue'}</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="pscreen">
      <StatusBar/>
      <div className="qbar">
        <button className="appbar__back" style={{padding:0}}
                onClick={()=> i>0 ? setI(i-1) : go(mode==='reveal'?'DS-DISC':'DS2')}>‹</button>
        <span className="qbar__t"><span className="qbar__f" style={{width:pct+'%'}}></span></span>
        <button className="qbar__s" onClick={skip}>Skip</button>
      </div>

      <div className="pbody">
        <div style={{padding:'14px 18px 22px'}}>
          <div className="qh">{step.q}</div>
          {step.sub && <div className="qsub">{step.sub}</div>}

          {/* ── drum: age ── */}
          {step.type==='drum' && (
            <div style={{marginTop:20}}>
              <Drum from={step.from} to={step.to} value={a[step.k]||step.def}
                    onChange={v=>set(step.k,v)}/>
            </div>)}

          {/* ── height: two drums + unit toggle ── */}
          {step.type==='height' && (()=>{
            const cm = a.hUnit==='cm';
            return (<div style={{marginTop:14}}>
              {cm
                ? <Drum from={140} to={210} value={a.height||175} onChange={v=>set('height',v)} suffix="cm"/>
                : <div style={{display:'flex',gap:10}}>
                    <Drum from={4} to={7}  value={a.ft||5} onChange={v=>set('ft',v)} suffix="feet"/>
                    <Drum from={0} to={11} value={a.in!=null?a.in:9} onChange={v=>set('in',v)} suffix="inches"/>
                  </div>}
              <div style={{display:'flex',justifyContent:'center',marginTop:16}}>
                <div className="unit">
                  <button className={!cm?'on':''} onClick={()=>set('hUnit','ft')}>FT</button>
                  <button className={cm?'on':''}  onClick={()=>set('hUnit','cm')}>CM</button>
                </div>
              </div>
            </div>);
          })()}

          {/* ── weight ── */}
          {step.type==='weight' && (()=>{
            const lb = a.wUnit==='lb';
            return (<div style={{marginTop:14}}>
              {lb ? <Drum from={90} to={400} value={a.wlb||210} onChange={v=>set('wlb',v)} suffix="lb"/>
                  : <Drum from={40} to={180} value={a.weight||96} onChange={v=>set('weight',v)} suffix="kg"/>}
              <div style={{display:'flex',justifyContent:'center',marginTop:16}}>
                <div className="unit">
                  <button className={!lb?'on':''} onClick={()=>set('wUnit','kg')}>KG</button>
                  <button className={lb?'on':''}  onClick={()=>set('wUnit','lb')}>LB</button>
                </div>
              </div>
            </div>);
          })()}

          {/* ── chips (single question) ── */}
          {step.type==='chips' && (
            <div className="chips" style={{marginTop:18}}>
              {step.o.map(o=>(
                <button key={o} className={'chip2'+(a[step.k]===o?' on':'')}
                        onClick={()=>set(step.k,o)}>{o}</button>))}
            </div>)}

          {/* ── map ── */}
          {step.type==='map' && (
            <div style={{marginTop:16}}>
              <MapPick label={a.loc||'Al Olaya'}/>
              <input className="mapin" placeholder="Enter your area or district"
                     defaultValue="Al Olaya, Riyadh" onChange={e=>set('loc',e.target.value)}/>
            </div>)}

          {/* ── multi: several chip groups on one scrolling screen ── */}
          {step.type==='multi' && (
            <div style={{marginTop:16}}>
              {step.groups.map(g=>(
                <ChipRow key={g} group={g} value={a[g]} onPick={v=>set(g,v)}/>))}
            </div>)}

          {/* ── primary goal ── */}
          {step.type==='goal' && (
            <div style={{marginTop:18}}>
              {GOALS.map(g=>(
                <button key={g.k} className={'gcard'+(a.goal===g.k?' on':'')}
                        onClick={()=>set('goal',g.k)}>
                  <div className="gcard__i">{g.ic}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="gcard__t">{g.t}</div>
                    <div className="gcard__s">{g.s}</div></div>
                  {a.goal===g.k && <span style={{color:'var(--deep)',fontSize:17}}>✓</span>}
                </button>))}
            </div>)}

          {step.type==='goal2' && (
            <div className="chips" style={{marginTop:18}}>
              {GOALS2.map(o=>{
                const sel=(a.goal2||[]);
                return <button key={o} className={'chip2'+(sel.indexOf(o)>-1?' on':'')}
                  onClick={()=>set('goal2', sel.indexOf(o)>-1?sel.filter(x=>x!==o):[...sel,o])}>{o}</button>;
              })}
            </div>)}

          <div className="priv"><span>👁</span>
            <span>Only your clinician sees this. Never your profile, never a partner.</span></div>
          <div className="why">Wondering why we ask? <u>Learn more</u></div>
        </div>
      </div>

      {/* bottom bar: counter CTA on multi screens, circular next elsewhere */}
      <div style={{padding:'10px 18px calc(var(--safe-bottom) + 12px)',borderTop:'1px solid var(--line)',
        background:'var(--surface-app)',display:'flex',alignItems:'center',gap:12}}>
        {step.type==='multi'
          ? <button className="btn btn--primary" style={{margin:0}} disabled={!canNext} onClick={next}>
              Next {gCount} / {step.groups.length}</button>
          : <>
              <span style={{fontSize:11.5,color:'var(--ink-2)',flex:1}}>
                {step.type==='goal' ? 'Pick the one that matters most' : ''}</span>
              <button className="gbtn" disabled={!canNext} onClick={next}>›</button>
            </>}
      </div>
    </div>
  );
}

/* ── PROTOCOLS ─────────────────────────────────────────────────
   The portfolio home. Per spec this is where the LOOP lives now —
   the ring and the current stage are the hero at the top, not a
   widget below a list. (The dedicated Loop page still exists and
   stays reachable from the app-bar ring; it isn't deleted.)
   Below the hero: saved protocols with the consult CTA, then
   running, then verified. */
function Protocols({st, go, dispatch}){
  const active = LOOPS.filter(l=>l.st==='active');
  const done   = LOOPS.filter(l=>l.st==='done');
  const L      = active.find(l=>l.id===st.focus) || active[0];
  const saved  = st.saved.map(id=>CATALOG.find(c=>c.id===id)).filter(Boolean);
  const open   = (id)=>{ dispatch({type:'SET', patch:{focus:id}}); go('T2-1'); };

  return (
    <div className="pscreen">
      <StatusBar/>
      <div className="appbar">
        <button className="appbar__back" onClick={()=>go('V0')}>‹ Valeo</button>
        <span className="appbar__spacer"></span>
        <button className="appbar__avatar" onClick={()=>go('T3-9')}>FA</button>
      </div>
      <div className="pbody">
        <div style={{padding:'6px 18px 26px'}}>

          {/* ══ THE LOOP — hero ══ */}
          {L && (
            <button className="lhero" style={{width:'100%',textAlign:'left',marginTop:4}}
                    onClick={()=>go('T2-9')}>
              <div className="lhero__row">
                <div style={{position:'relative',flexShrink:0}}>
                  <LoopRing size={78} sw={15} phase={L.phase}
                            fill={Math.min(1,L.day/L.total*1.5)} loops={st.loop-1} dark={true}/>
                  <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',
                    justifyContent:'center',fontSize:24}}>{L.ic}</div>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div className="lhero__k">◈ Loop {st.loop} · {L.phase}</div>
                  <div className="lhero__t">{L.t}</div>
                  <div className="lhero__s">Day <b style={{color:'#fff'}}>{L.day}</b> of {L.total} ·
                    {' '}{L.adh}% adherence · verdict {L.due}</div>
                </div>
              </div>
              <div className="lhero__ph">
                {PHASES.map((p,i)=>{
                  const ci = PHASES.indexOf(L.phase);
                  return <span key={p} className={i<ci?'d':i===ci?'n':''}>{p}{i<ci?' ✓':''}</span>;
                })}
              </div>
              <div style={{marginTop:13,paddingTop:12,borderTop:'1px solid rgba(255,255,255,.13)',
                fontSize:12,lineHeight:1.5,position:'relative',zIndex:1}}>
                🔒 <b style={{color:'var(--yellow)'}}>{L.marker}</b>{' '}
                <span style={{color:'rgba(255,255,255,.72)'}}>{L.from} → {L.target}</span>
              </div>
            </button>
          )}

          {/* loop switcher when more than one is running */}
          {active.length>1 && (
            <div style={{display:'flex',gap:8,marginTop:11,overflowX:'auto'}}>
              {active.map(l=>(
                <button key={l.id} onClick={()=>dispatch({type:'SET',patch:{focus:l.id}})}
                  style={{flexShrink:0,padding:'8px 12px',borderRadius:11,fontSize:11.5,fontWeight:700,
                    background: l.id===(L&&L.id) ? 'var(--deep)' : 'var(--surface-sunken)',
                    color: l.id===(L&&L.id) ? '#fff' : 'var(--ink-2)'}}>
                  {l.ic} {l.t}</button>))}
            </div>
          )}

          {/* ══ SAVED ══ the swipe output, and where consults get booked ══ */}
          <div className="kick" style={{margin:'26px 0 4px'}}>Matches · {saved.length}</div>
          {saved.length===0 && (
            <div style={{fontSize:12.5,color:'var(--ink-2)',lineHeight:1.55,padding:'10px 0'}}>
              No matches yet. <b style={{color:'var(--deep)'}}>Swipe in Discover</b> and every twin you
              keep lands here with their protocol.</div>
          )}
          {saved.map(c=>{
            const isDone = st.consulted.indexOf(c.id)>-1;
            const T = tierOf(c.tier);
            return (
              <div className="prow" key={c.id}>
                <div className="prow__i" style={{background:T.bg}}>{c.ic}</div>
                <div style={{flex:1,minWidth:0}} onClick={()=>dispatch({type:'CARD', id:c.id})}>
                  <div className="prow__t">{c.t}</div>
                  <div className="prow__s">
                    {isDone
                      ? <><b style={{color:'var(--green)'}}>✓ Reviewed with Coach Layla</b> · protocol ready</>
                      : <>{c.match}% match · {c.wk} wk · scores {c.mk}</>}
                  </div>
                </div>
                <button className={'prow__cta'+(isDone?' prow__cta--done':'')}
                  onClick={()=> isDone ? go('DS12') : go('DS10')}>
                  {isDone ? 'View protocol' : 'Book free consult'}</button>
              </div>);
          })}
          {saved.length>0 && (
            <div style={{display:'flex',gap:10,background:'var(--teal-soft)',borderRadius:16,
              padding:'13px 14px',marginTop:14}}>
              <span>🩺</span>
              <span style={{fontSize:11.5,color:'#1F5C6B',lineHeight:1.55}}>
                <b style={{color:'var(--deep)'}}>The consult is free and it's where you actually decide.</b>{' '}
                A coach walks the protocol with you, answers what the card couldn't, and fills in the
                rest of your twin while you talk.</span>
            </div>
          )}

          {/* ══ RUNNING ══ */}
          <div className="kick" style={{margin:'26px 0 10px'}}>Running · {active.length}</div>
          {active.map(l=>(
            <button key={l.id} className="surface" style={{width:'100%',textAlign:'left',
              marginBottom:11,padding:16,
              border:st.focus===l.id?'1.5px solid var(--yellow)':'1.5px solid transparent'}}
              onClick={()=>open(l.id)}>
              <div style={{display:'flex',alignItems:'center',gap:13}}>
                <div style={{position:'relative',flexShrink:0}}>
                  <LoopRing size={46} sw={14} phase={l.phase} fill={Math.min(1,l.day/l.total*1.5)}
                            loops={0} dark={false}/>
                  <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',
                    justifyContent:'center',fontSize:15}}>{l.ic}</div>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:15,fontWeight:700,color:'var(--deep)'}}>{l.t}</div>
                  <div style={{fontSize:11.5,color:'var(--ink-2)',marginTop:2}}>
                    Day {l.day} of {l.total} · {l.phase} · {l.adh}% adherence</div>
                </div>
                {st.focus===l.id && <span style={{fontSize:9,fontWeight:800,letterSpacing:'.05em',
                  textTransform:'uppercase',background:'var(--yellow)',color:'var(--deep)',
                  padding:'3px 7px',borderRadius:5}}>Focused</span>}
              </div>
              <div style={{fontSize:11.5,color:'var(--teal)',marginTop:10,fontWeight:600}}>
                Next · {l.next}</div>
            </button>))}

          {/* ══ VERIFIED ══ */}
          <div className="kick" style={{margin:'26px 0 10px'}}>Verified · {done.length}</div>
          {done.map(l=>(
            <div key={l.id} className="surface" style={{padding:16,marginBottom:11,
              background:'var(--slate-soft)'}}>
              <div style={{display:'flex',alignItems:'center',gap:13}}>
                <svg width="40" height="40" viewBox="0 0 200 200" style={{flexShrink:0}}>
                  <g transform="translate(100,100)"><circle r="80" stroke="var(--slate)"
                    strokeWidth="17" fill="none" opacity=".8"/></g></svg>
                <div style={{flex:1}}>
                  <div style={{fontSize:14.5,fontWeight:700,color:'var(--deep)'}}>{l.t}</div>
                  <div style={{fontSize:11.5,color:'var(--ink-2)',marginTop:2}}>
                    {l.marker} {l.from} → {l.to} · {l.when}</div>
                </div>
                <span style={{fontSize:9.5,fontWeight:800,letterSpacing:'.05em',textTransform:'uppercase',
                  background:'rgba(74,90,114,.16)',color:'var(--slate)',padding:'4px 9px',
                  borderRadius:14}}>Refuted</span>
              </div>
              <div style={{fontSize:12,color:'var(--ink-2)',marginTop:11,paddingTop:10,
                borderTop:'1px solid rgba(27,57,91,.08)',lineHeight:1.5}}>{l.note}</div>
              <button className="btn btn--ghost" style={{marginTop:11}} onClick={()=>go('DS14')}>
                What this taught your twin →</button>
            </div>))}

          <div style={{display:'flex',gap:10,background:'var(--surface-sunken)',borderRadius:16,
            padding:'13px 14px',marginTop:16}}>
            <span>🔬</span>
            <span style={{fontSize:11.5,color:'var(--ink-2)',lineHeight:1.55}}>
              <b style={{color:'var(--deep)'}}>One loop per marker.</b> Protocols can run side by side —
              but never two that could move the same number, or neither answer would mean anything.</span>
          </div>

          <button className="qrow" style={{width:'100%',textAlign:'left',marginTop:16}}
                  onClick={()=>go('DS-DISC')}>
            <div className="qrow__ico">◇</div>
            <div className="qrow__b"><div className="qrow__t">Find more protocols</div>
              <div className="qrow__s">Swipe what your twin has scored for you</div></div>
            <span className="qrow__chev">›</span>
          </button>
        </div>
      </div>
      {st.card && (()=>{ const tw=TWINS.find(t=>t.protocol===st.card);
        return tw ? <TwinSheet id={tw.id} st={st} go={go}
          dispatch={a=>dispatch(a.type==='TWINCARD'?{type:'CARD',id:null}:a)}/> : null; })()}
      <TabBar active="protocols" go={go}/>
      <div className="home-indicator"></div>
    </div>
  );
}

const COMPS = {V0:V0Home, Today, Loop:LoopTab, Twin, Protocols, Discover,
  DsIntro, DsWarm, DsQuiz, DsAssembly, DsConsult, DsConsultDone, DsVerdictTwin};

/* ── iframe fallback for self-contained linear documents ── */
function IframeScreen({file, onMsg}){
  useEffect(()=>{
    const h = e => { const m=e.data; if(m && m.source==='valeo-screen') onMsg(m); };
    window.addEventListener('message',h); return ()=>window.removeEventListener('message',h);
  },[onMsg]);
  const src = 'screens/' + file
    + (MOBILE ? (file.indexOf('?') > -1 ? '&' : '?') + 'fluid=1' : '');
  return <iframe src={src} title={file}/>;
}

/* ── meta cards ── */
function MetaCard({node, go, dispatch}){
  const t=node.type;
  const eyebrow={branch:'Branch point',skip:'Time skip',loop:'Recursion',end:'Terminal state'}[t];
  return (
    <div className="meta">
      <div className="meta__e">◆ {eyebrow}</div>
      {node.icon && <div className="meta__i">{node.icon}</div>}
      <div className="meta__t">{node.headline||node.title}</div>
      {t==='branch' ? <>
        <div className="meta__q" dangerouslySetInnerHTML={{__html:node.q}}/>
        {node.why && <div className="meta__w">{node.why}</div>}
        {node.options.map((o,i)=>(
          <button key={i} className={'opt opt--'+(o.tone||'alt')}
                  onClick={()=>go(o.to, o.set)}>
            <span className="opt__k">{i+1}</span>
            <span style={{flex:1}}><span className="opt__l">{o.label}</span>
              <span className="opt__s">{o.sub}</span></span></button>))}
        <div className="grow"></div>
        <div className="mfoot">Every branch is reversible — {MOBILE
          ? 'tap ☰ to go back or jump anywhere.'
          : 'use Back, the rail, or Map to explore the others.'}</div>
      </> : <>
        {node.detail && <div className="meta__q" dangerouslySetInnerHTML={{__html:node.detail}}/>}
        {t==='skip' && <div className="skb"><i></i></div>}
        {node.deltas && <div style={{marginTop:18}}>{node.deltas.map((d,i)=>(
          <div className="dl" key={i}><span>{d[0]}</span><b>{d[1]}</b></div>))}</div>}
        <div className="grow"></div>
        {node.to ? <button className="mcta" onClick={()=>go(node.to)}>Continue →</button>
                 : <div className="mfoot">End of this path. {MOBILE
                     ? 'Tap ☰ to pick another branch.'
                     : 'Pick another branch from the rail or the Map.'}</div>}
      </>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   5 · SHELL
   ══════════════════════════════════════════════════════════════ */
function exitsOf(id){
  const n=FLOW[id]; if(!n) return [];
  const out=[];
  if(n.options) n.options.forEach(o=>out.push({to:o.to,k:'branch'}));
  ['to','primary','secondary','back'].forEach(k=>{ if(n[k]) out.push({to:n[k],k:k==='back'?'back':'flow'}); });
  if(n.exits) n.exits.forEach(e=>out.push({to:e,k:'flow'}));
  const seen={}; return out.filter(e=>FLOW[e.to] && !seen[e.to] && (seen[e.to]=1));
}

/* Mobile mode is opt-in via ?m=1 and touches nothing on the default path. */
const MOBILE = new URLSearchParams(location.search).has('m');
if (MOBILE) document.body.classList.add('mob');

function MobileShell({st, node, go, dispatch, isMeta, Comp, onIframeMsg}){
  const [open, setOpen] = React.useState(false);
  const jump = id => { setOpen(false); go(id); };
  return (
    <div className="mstage">
      <div className="phone">
        {isMeta ? <MetaCard node={node} go={go} dispatch={dispatch}/>
         : Comp ? <Comp st={st} go={go} dispatch={dispatch}/>
         : <IframeScreen key={st.node} file={node.file} onMsg={onIframeMsg}/>}
      </div>

      <button className="mfab" onClick={()=>setOpen(true)} aria-label="Flow navigator">☰</button>

      {open && (
        <div className="msheet" onClick={()=>setOpen(false)}>
          <div className="msheet__in" onClick={e=>e.stopPropagation()}>
            <div className="msheet__g"></div>
            <div className="msheet__act">
              <button disabled={!st.history.length} onClick={()=>{setOpen(false);dispatch({type:'BACK'});}}>‹ Back</button>
              <button onClick={()=>{setOpen(false);dispatch({type:'RESET'});}}>Reset</button>
              <button className="pri" onClick={()=>setOpen(false)}>Close</button>
            </div>
            <div className="msheet__l">
              {STAGES.map(sg=>{
                const ids = Object.keys(FLOW).filter(k=>FLOW[k].stage===sg);
                if(!ids.length) return null;
                return (
                  <div key={sg}>
                    <div className="msheet__s">{sg}</div>
                    {ids.map(id=>(
                      <div key={id}
                           className={'msheet__n'+(id===st.node?' on':'')+(st.visited[id]?' vis':'')}
                           onClick={()=>jump(id)}>
                        <i></i><span>{FLOW[id].title}</span>
                      </div>))}
                  </div>);
              })}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  const [st, dispatch] = useReducer(reducer, INIT);
  const node = FLOW[st.node];
  const go = useCallback((to,set)=>dispatch({type:'GO',to,set}),[]);
  const phoneRef = useRef(null), wrapRef = useRef(null);

  const fit = useCallback(()=>{
    const avail = window.innerHeight-56-52-80;
    const k = Math.min(1, Math.max(.5, avail/844));
    if(phoneRef.current){ phoneRef.current.style.transform='scale('+k+')'; }
    if(wrapRef.current){ wrapRef.current.style.height=(844*k)+'px'; wrapRef.current.style.width=(390*k)+'px'; }
  },[]);
  useEffect(()=>{ fit(); window.addEventListener('resize',fit); return ()=>window.removeEventListener('resize',fit); },[fit,st.node,st.mode]);

  useEffect(()=>{
    const h=e=>{
      if(e.key==='ArrowLeft')  dispatch({type:'BACK'});
      if(e.key==='ArrowRight'){ const n=FLOW[st.node]; const f=n.to||n.primary; if(f) go(f); }
      if(e.key==='m'||e.key==='M') dispatch({type:'MODE',mode:st.mode==='walk'?'map':'walk'});
      if(node.options && /^[1-9]$/.test(e.key)){ const o=node.options[+e.key-1]; if(o) go(o.to,o.set); }
    };
    window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h);
  },[st.node,st.mode,node,go]);

  const onIframeMsg = useCallback(m=>{
    const n=FLOW[st.node]; if(!n||m.type==='ready') return;
    if(m.type==='nav' && FLOW[m.to]) return go(m.to);
    if(m.type==='back') return n.back?go(n.back):dispatch({type:'BACK'});
    if(m.type==='secondary' && n.secondary) return go(n.secondary);
    if(n.primary) return go(n.primary);
  },[st.node,go]);

  const isMeta = !!node.type;
  const Comp = node.comp ? COMPS[node.comp] : null;

  if (MOBILE) return <MobileShell st={st} node={node} go={go} dispatch={dispatch}
                                  isMeta={isMeta} Comp={Comp} onIframeMsg={onIframeMsg}/>;

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand"><div className="brand__m">V</div>
          <div>The Loop <span className="brand__s">· React prototype</span></div></div>
        <div className="msw">
          <button className={st.mode==='walk'?'on':''} onClick={()=>dispatch({type:'MODE',mode:'walk'})}>Walk</button>
          <button className={st.mode==='map'?'on':''} onClick={()=>dispatch({type:'MODE',mode:'map'})}>Map</button>
        </div>
        <div className="chips">
          <span className="chipx">Day <b>{st.day}</b></span>
          <span className="chipx">Adherence <b>{st.adherence}%</b></span>
          <span className="chipx">Loop <b>{st.loop}</b></span>
          <span className="chipx">Phase <b>{st.phase}</b></span>
          <button className="tbtn" onClick={()=>dispatch({type:'RESET'})}>Reset</button>
        </div>
      </div>

      <div className="main">
        {st.mode==='walk' && <Rail st={st} go={go}/>}

        {st.mode==='walk' ? (
          <div className="stage">
            <div className={'ktag '+(isMeta?'ktag--m':Comp?'ktag--n':'ktag--d')}>
              {isMeta?'Demo control':Comp?'Native React · '+st.node:'Document · '+st.node}
            </div>
            <div className="phonewrap" ref={wrapRef}>
              <div className="phone" ref={phoneRef}>
                {isMeta ? <MetaCard node={node} go={go} dispatch={dispatch}/>
                 : Comp ? <Comp st={st} go={go} dispatch={dispatch}/>
                 : <IframeScreen key={st.node} file={node.file} onMsg={onIframeMsg}/>}
              </div>
            </div>
          </div>
        ) : <MapView st={st} go={go} dispatch={dispatch}/>}

        {st.mode==='walk' && <WhyPanel st={st} node={node} go={go}/>}
      </div>

      <div className="bottom">
        <button className="nbtn" disabled={!st.history.length} onClick={()=>dispatch({type:'BACK'})}>‹ Back</button>
        <div className="trail">
          {[...st.history.slice(-7), st.node].map((id,i,arr)=>(
            <React.Fragment key={i}>
              {i>0 && <span style={{color:'#3D5470',fontSize:9}}>›</span>}
              <span className={'cr'+(i===arr.length-1?' now':'')} onClick={()=>go(id)}>{FLOW[id].title}</span>
            </React.Fragment>))}
        </div>
        <button className="nbtn" disabled={!(node.to||node.primary)}
                onClick={()=>go(node.to||node.primary)}>Continue ›</button>
      </div>
    </div>
  );
}

function Rail({st, go}){
  return (
    <div className="rail">
      <div className="rhint">Every node is directly clickable. No flow is ever gated behind another.</div>
      {STAGES.map(sg=>{
        const ids=Object.keys(FLOW).filter(k=>FLOW[k].stage===sg);
        if(!ids.length) return null;
        return <div key={sg}>
          <div className="sname">{sg}</div>
          {ids.map(id=>{ const n=FLOW[id];
            const b = n.type==='branch'?['b-fork','FORK']:n.type==='skip'?['b-time','TIME']
                    :(n.type==='loop'||n.type==='end')?['b-loop','LOOP']:n.comp?['b-app','APP']:null;
            return <div key={id} className={'nd'+(id===st.node?' on':'')+(st.visited[id]?' vis':'')}
                        onClick={()=>go(id)}>
              <span className="nd__d"></span><span className="nd__l">{n.title}</span>
              {b && <span className={'bdg '+b[0]}>{b[1]}</span>}</div>;})}
        </div>;
      })}
    </div>
  );
}

function WhyPanel({st, node, go}){
  const ex = exitsOf(st.node);
  return (
    <div className="why">
      <div className="why__id">{st.node} · {node.stage}</div>
      <div className="why__t">{node.title}</div>
      {node.note && <><div className="why__k">Why this screen looks like this</div>
        <div className="why__b" dangerouslySetInnerHTML={{__html:node.note}}/></>}
      {!node.note && node.why && <><div className="why__k">Why this fork exists</div>
        <div className="why__b">{node.why}</div></>}
      {!node.note && !node.why && node.detail && <><div className="why__k">What just happened</div>
        <div className="why__b" dangerouslySetInnerHTML={{__html:node.detail}}/></>}
      {ex.length>0 && <><div className="why__k">Where this goes ({ex.length})</div>
        {ex.map((e,i)=>(<button key={i} className="exit" onClick={()=>go(e.to)}>
          <i>{e.k==='back'?'↩':'→'}</i><span>{FLOW[e.to].title}</span></button>))}</>}
      <div className="why__k">Render</div>
      <div className="why__b" style={{fontSize:11,color:'#7E93AC'}}>
        {node.comp ? 'Native React component <'+node.comp+'/> — shares AppBar, LoopRing and TabBar with app state.'
         : node.file ? 'screens/'+node.file+' — self-contained document in an iframe.'
         : 'Shell-rendered demo control.'}
      </div>
    </div>
  );
}

function MapView({st, go, dispatch}){
  const svgRef=useRef(null), innerRef=useRef(null);
  useEffect(()=>{
    const draw=()=>{
      const svg=svgRef.current, inner=innerRef.current; if(!svg||!inner) return;
      const box=inner.getBoundingClientRect();
      svg.setAttribute('width',inner.scrollWidth); svg.setAttribute('height',inner.scrollHeight);
      const si=id=>STAGES.indexOf(FLOW[id].stage);
      let p='';
      Object.keys(FLOW).forEach(from=>{
        const a=document.getElementById('m_'+from.replace(/[^\w]/g,'_')); if(!a) return;
        const ra=a.getBoundingClientRect();
        exitsOf(from).forEach(e=>{
          const b=document.getElementById('m_'+e.to.replace(/[^\w]/g,'_')); if(!b) return;
          const rb=b.getBoundingClientRect();
          const L1=ra.left-box.left,R1=ra.right-box.left,T1=ra.top-box.top,B1=ra.bottom-box.top;
          const M1=T1+ra.height/2,CX1=L1+ra.width/2;
          const L2=rb.left-box.left,R2=rb.right-box.left,T2=rb.top-box.top,B2=rb.bottom-box.top;
          const M2=T2+rb.height/2,CX2=L2+rb.width/2;
          const s=si(from),t=si(e.to);
          let d,stroke='#4E6E92',dash='',w=1.4,op=.42;
          if(e.k==='branch'){stroke='#FFB900';op=.58;w=1.6;}
          if(t===s){
            const down=T2>B1;
            if(down&&(T2-B1)<26) d='M'+CX1+','+B1+' L'+CX2+','+T2;
            else{const g=R1+16; d='M'+R1+','+M1+' C'+g+','+M1+' '+g+','+M2+' '+R2+','+M2;}
            if(!down){dash='5 5';stroke='#9FB8FF';op=.48;}
          } else if(t<s){
            const lift=30+((s*7+t*13)%26);
            d='M'+L1+','+M1+' C'+(L1-90)+','+(M1-lift)+' '+(R2+90)+','+(M2-lift)+' '+R2+','+M2;
            stroke='#9FB8FF';dash='5 5';op=.48;
          } else { const mx=(R1+L2)/2; d='M'+R1+','+M1+' C'+mx+','+M1+' '+mx+','+M2+' '+L2+','+M2; }
          p+='<path d="'+d+'" fill="none" stroke="'+stroke+'" stroke-width="'+w+'" stroke-dasharray="'+dash+'" opacity="'+op+'" stroke-linecap="round"/>';
        });
      });
      svg.innerHTML=p;
    };
    const id=requestAnimationFrame(draw);
    window.addEventListener('resize',draw);
    return ()=>{cancelAnimationFrame(id);window.removeEventListener('resize',draw);};
  },[st.node]);

  return (
    <div className="map">
      <div className="mlg">
        <span><i style={{background:'#4E6E92'}}></i>forward</span>
        <span><i style={{background:'#FFB900'}}></i>branch outcome</span>
        <span><i style={{background:'#9FB8FF'}}></i>recursion / back-edge</span>
        <span style={{marginLeft:'auto',color:'#5E7391'}}>Every node is clickable — no flow is gated.</span>
      </div>
      <div className="mapin" ref={innerRef}>
        <svg ref={svgRef} style={{position:'absolute',inset:0,pointerEvents:'none',overflow:'visible'}}/>
        {STAGES.map(sg=>{
          const ids=Object.keys(FLOW).filter(k=>FLOW[k].stage===sg);
          if(!ids.length) return null;
          return <div className="mcol" key={sg}>
            <div className="mch">{sg}</div>
            {ids.map(id=>{const n=FLOW[id];
              const c=n.type==='branch'?' mn--fork':n.type==='skip'?' mn--time':(n.type==='loop'||n.type==='end')?' mn--loop':'';
              const sub=n.type==='branch'?n.options.length+' outcomes':n.headline||(n.comp?'Native component':'');
              return <div key={id} id={'m_'+id.replace(/[^\w]/g,'_')}
                          className={'mn'+c+(id===st.node?' on':'')}
                          onClick={()=>{dispatch({type:'MODE',mode:'walk'});go(id);}}>
                <div className="mn__i">{id}</div><div className="mn__l">{n.title}</div>
                {sub && <div className="mn__s">{sub}</div>}</div>;})}
          </div>;
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
